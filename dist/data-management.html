<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="DAMA-DMBOKの知識体系に沿って、データガバナンス・データ品質・メタデータなど、データマネジメントの考え方を図解・実験・理解チェックで学ぶ。"><title>データマネジメント入門｜Data Management Lab</title>
<style>/* 学習サイト共通のスタイル。構成は「自然言語処理入門」と同じで、色はサイトごとに index.html の :root で上書きする。 */
:root{
  --ink:#172b28;--muted:#5f6f6b;--line:#dce2d6;--paper:#f6f7f1;--panel:#fff;--field:#fafbf7;
  --accent:#196b54;--accent-deep:#11513e;--tint:#e9eedf;--tint-2:#cbd9c0;--tint-3:#f0f4e9;--hi:#d9eea5;
  --warm:#d8864f;--warm-bg:#fcf1e7;--ok-bg:#e5f0d8;--ng:#c05d3f;--ng-bg:#fce9e2;--code:#182b29;--code-ink:#e4eddc
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#e5ebe8;--muted:#9fb0ab;--line:#2f3b39;--paper:#111817;--panel:#18211f;--field:#141c1a;
  --tint:var(--dk-tint);--tint-2:var(--dk-tint-2);--tint-3:var(--dk-tint-3);--accent:var(--dk-accent);--accent-deep:var(--dk-accent);
  --warm-bg:#2d2219;--ok-bg:#1d3326;--ng-bg:#3a2320;--code:#0b1110}}
:root[data-theme="dark"]{
  --ink:#e5ebe8;--muted:#9fb0ab;--line:#2f3b39;--paper:#111817;--panel:#18211f;--field:#141c1a;
  --tint:var(--dk-tint);--tint-2:var(--dk-tint-2);--tint-3:var(--dk-tint-3);--accent:var(--dk-accent);--accent-deep:var(--dk-accent);
  --warm-bg:#2d2219;--ok-bg:#1d3326;--ng-bg:#3a2320;--code:#0b1110}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:15px;line-height:1.9}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);border-radius:7px;padding:8px 16px;background:var(--panel);color:var(--ink)}
button:hover{border-color:var(--accent);background:var(--tint)}
button,a,input,select,textarea,summary{outline-offset:4px}
:focus-visible{outline:3px solid var(--accent)}
.primary{background:var(--accent);color:#fff;border-color:var(--accent);text-decoration:none;display:inline-block;border-radius:7px;padding:10px 22px}
.primary:hover{background:var(--accent-deep);color:#fff}
.quiet{background:transparent;font-size:12px}
.skip{position:absolute;left:20px;top:-100px;background:var(--panel);z-index:100;padding:6px 10px}.skip:focus{top:10px}

/* ヘッダー */
header{height:83px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 38px;border-bottom:1px solid var(--line);background:var(--paper)}
.brand{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink);font-size:17px;letter-spacing:-.3px}
.brand b{font-weight:400}
.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--hi);font:bold 24px Georgia,serif;flex:none}
.header-right{display:flex;align-items:center;gap:20px}
.edition{font-size:10px;letter-spacing:1.5px;color:var(--muted)}
.home-link{font-size:12px;text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:6px 12px;white-space:nowrap;color:var(--ink)}
.home-link:hover{border-color:var(--accent);color:var(--accent)}

/* サイドバー */
.layout{display:grid;grid-template-columns:266px minmax(0,1fr);max-width:1600px;margin:auto}
aside{border-right:1px solid var(--line);padding:30px 20px;align-self:start;position:sticky;top:0;max-height:100vh;overflow:auto}
.side-intro{font-size:10px;letter-spacing:1.6px;color:var(--accent);font-weight:700}
.side-intro span{display:block;letter-spacing:0;font-size:12px;color:var(--muted);font-weight:400;margin-top:5px}
.search-label{display:block;font-size:11px;margin:24px 0 5px;color:var(--muted)}
input[type=search]{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:8px 10px;font-size:12px}
nav{margin-top:20px}
.nav-phase{font-size:10px;letter-spacing:1px;color:var(--muted);margin:16px 10px 4px;font-weight:700}
.navitem{display:flex;gap:12px;align-items:center;padding:8px 10px;margin:2px 0;text-decoration:none;font-size:12px;color:var(--muted);border-radius:6px;line-height:1.6}
.navitem:hover,.navitem.active{background:var(--tint);color:var(--accent)}
.navitem .num{font:12px ui-monospace,monospace;color:var(--muted);width:22px;flex:none}
.navitem.done .num{color:var(--accent)}
.progressbox{border-top:1px solid var(--line);margin-top:26px;padding-top:20px;font-size:11px}
.progressbox>div{display:flex;justify-content:space-between}
.progressbox small{font-size:10px;color:var(--muted)}
progress{width:100%;height:5px;accent-color:var(--accent)}
.empty{padding:10px;font-size:12px;color:var(--muted)}

/* ホーム */
main{padding:48px 6%;min-width:0;outline:none}
.eyebrow{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--accent);margin:0 0 20px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:38px;align-items:center;min-height:360px}
h1{font-size:clamp(32px,3.6vw,54px);line-height:1.45;letter-spacing:-1.5px;margin:0 0 22px;font-weight:650}
h1 em{font-style:normal;color:var(--accent)}
.lead{color:var(--muted);max-width:580px;font-size:14px}
.hero .primary{margin-top:18px}
.hero-visual{padding:26px 22px;background:var(--tint);border:1px solid var(--tint-2);border-radius:18px}
.visual-label{font:10px ui-monospace,monospace;letter-spacing:1.5px;color:var(--muted);margin-bottom:14px}
.hv-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hv-box{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--tint-2);border-radius:6px;background:var(--panel);font-size:12px;text-align:center;line-height:1.6}
.hv-box small{display:block;font-size:10px;color:var(--muted)}
.hv-dark{background:var(--ink);color:var(--hi);border-color:var(--ink)}
.hv-dark small{color:var(--hi);opacity:.75}
.hv-arrow{text-align:center;color:var(--accent);line-height:2.2}
.hv-note{display:block;text-align:center;color:var(--muted);font-size:10px;margin-top:12px}
.hv-bars{display:grid;gap:7px}
.hv-bar{display:grid;grid-template-columns:72px 1fr;gap:8px;align-items:center;font-size:11px}
.hv-bar i{display:block;height:14px;border-radius:3px;background:var(--accent)}
.hv-bar i.crit{background:var(--warm)}
.facts{display:flex;gap:35px;flex-wrap:wrap;padding:24px 0;border-bottom:1px solid var(--line);margin-bottom:38px}
.facts b{font:24px Georgia,serif;display:block}
.facts span{font-size:11px;color:var(--muted)}
.field-teaser{display:flex;flex-direction:column;border:1px solid var(--tint-2);border-radius:10px;background:var(--tint);padding:22px 26px;text-decoration:none;color:var(--ink);margin:8px 0 36px}
.field-teaser span{font-size:11px;color:var(--accent)}
.field-teaser b{font-size:21px;margin:3px 0}
.field-teaser small{color:var(--muted);font-size:12px}
.field-teaser:hover{border-color:var(--accent)}
.sectionhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:36px 0 20px}
.sectionhead h2{margin:0;font-size:23px;letter-spacing:-.5px}
.sectionhead small{color:var(--muted)}
.phase{display:grid;grid-template-columns:116px minmax(0,1fr);gap:20px;margin-bottom:30px}
.phase-label{font-size:11px;color:var(--muted);padding-top:15px}
.phase-label b{display:block;font-size:15px;color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.chaptercard{display:flex;flex-direction:column;padding:19px;background:var(--panel);border:1px solid var(--line);border-radius:9px;text-decoration:none;color:var(--ink);min-height:160px;transition:transform .15s,border .15s}
a.chaptercard:hover{transform:translateY(-3px);border-color:var(--accent)}
.chaptercard .index{font:12px ui-monospace,monospace;color:var(--accent)}
.chaptercard h3{font-size:16px;margin:9px 0 5px;line-height:1.6}
.chaptercard p{font-size:11px;color:var(--muted);margin:0;flex:1}
.chaptercard small{font-size:10px;margin-top:15px;color:var(--muted)}
.chaptercard.planned{background:transparent;border-style:dashed;color:var(--muted);min-height:110px}
.chaptercard.planned .index{color:var(--muted)}
.guide{background:var(--tint);padding:24px 28px;border-radius:10px;margin:25px 0}
.guide h3{margin:0 0 8px;font-size:17px}
.guide p{margin:6px 0;font-size:13px}
.schedule{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.schedule>div{padding:15px;border-top:2px solid var(--accent);font-size:12px}
.schedule b{display:block;font-size:14px}
.sources{font-size:12px;color:var(--muted)}
.sources a,.sources .src{display:block;margin:7px 0}

/* 章のページ */
.lesson{max-width:880px;margin:auto}
.lesson-nav{font-size:12px;color:var(--muted);margin-bottom:24px}
.lesson-nav a{text-decoration:none}
.lesson h1{font-size:36px;letter-spacing:-1px}
.lesson h2{font-size:22px;margin:38px 0 15px;line-height:1.5}
.lesson h2 .secnum{color:var(--accent);font:14px ui-monospace,monospace;margin-right:10px}
.lesson h3{font-size:16px}
.lesson p,.lesson li{font-size:14px}
.lesson .summary{font-size:16px;color:var(--muted)}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.tags span{font-size:10px;padding:3px 9px;background:var(--tint);border-radius:20px}
.objectives{border-left:3px solid var(--accent);padding:8px 22px;margin:25px 0;background:var(--tint-3)}
.objectives p{margin:5px 0}
.flow{display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap;margin:25px 0;padding:22px 14px;background:var(--tint);border-radius:10px}
.flow .node{padding:10px 15px;border:1px solid var(--tint-2);background:var(--panel);border-radius:7px;font-size:13px;text-align:center}
.flow .node small{display:block;color:var(--muted);font-size:10px}
.flow .node.dark{background:var(--ink);color:var(--hi);border-color:var(--ink)}
.flow .connector{color:var(--accent)}
.formula{padding:18px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font:16px ui-monospace,monospace;text-align:center;overflow:auto;line-height:1.8;margin:18px 0}
.formula small{font:12px sans-serif;display:block;color:var(--muted);margin-top:9px}
.note{padding:15px 20px;border-radius:7px;border-left:3px solid var(--warm);background:var(--warm-bg);font-size:13px;margin:20px 0}
.tree{display:flex;align-items:center;gap:18px;margin:20px 0;flex-wrap:wrap}
.tree-root{background:var(--ink);color:var(--panel);padding:12px 14px;font-weight:700;max-width:220px;border-radius:8px}
.tree-kids{display:grid;gap:8px;flex:1;min-width:240px}
.tree-kid{border-left:3px solid var(--accent);background:var(--tint);padding:8px 12px;font-size:14px;border-radius:0 6px 6px 0}
.tree-kid ul{margin:4px 0 0;padding-left:1.2em}
.tablewrap{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px;margin:20px 0;background:var(--panel)}
th,td{padding:9px 12px;border:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--tint);white-space:nowrap}
.lesson section>details{border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:14px 0}
.lesson section>details summary{cursor:pointer;color:var(--accent);font-size:13px}

/* 実験（TRY IT YOURSELF） */
.lab{border:1px solid var(--tint-2);background:var(--panel);border-radius:12px;padding:24px;margin:25px 0}
.lab-heading{font-size:11px;color:var(--accent);letter-spacing:1.5px;font-weight:700}
.lab h3{margin:9px 0}
.lab label{display:block;font-size:12px;margin:12px 0 5px}
.lab input:not([type=range]):not([type=radio]),.lab textarea,.lab select{border:1px solid var(--line);padding:9px;border-radius:6px;max-width:100%;width:100%;background:var(--field)}
input[type=range]{width:100%;accent-color:var(--accent)}
.labresult{margin-top:18px;min-height:50px;background:var(--tint-3);border-radius:7px;padding:16px 18px;font-size:13px}
.labresult p{margin:4px 0}
.labgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 14px}
.choice-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.choice-cards>div{border:1px solid var(--line);border-radius:9px;padding:14px 16px;font-size:13px;background:var(--field)}
.choice-cards b{display:block;font:12px ui-monospace,monospace;color:var(--accent);margin-bottom:4px}
.choice-cards .picked-ok{border-color:var(--accent);background:var(--ok-bg)}
.choice-cards .picked-ng{border-color:var(--ng);background:var(--ng-bg)}
.lab-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.sortlist{list-style:none;padding:0;margin:12px 0}
.sortlist li{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:12px;align-items:center;border-top:1px solid var(--line);padding:9px 0;font-size:13px}
.sortlist li.ok .mark:before{content:'✓ ';color:var(--accent)}
.sortlist li.ng .mark:before{content:'✗ ';color:var(--ng)}
.sortlist .why{grid-column:1/-1;font-size:12px;color:var(--muted);margin:-2px 0 0}
.checks label{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin:8px 0}
.checks input{margin-top:6px}
.metrics{display:flex;gap:20px;flex-wrap:wrap}
.metric{font:22px ui-monospace,monospace;color:var(--accent);padding:6px 4px}
.metric small{display:block;font:11px sans-serif;color:var(--muted)}
.metric.warn{color:var(--ng)}
.bars .barrow{display:grid;grid-template-columns:90px 1fr 60px;gap:10px;align-items:center;margin:8px 0;font-size:12px}
.bartrack{height:14px;background:var(--tint);border-radius:3px;overflow:hidden}
.barfill{height:100%;background:var(--accent);transition:width .2s}
.barfill.crit{background:var(--warm)}
.builder-out{white-space:pre-wrap}

/* 理解チェック・演習・メモ */
.quiz{margin:25px 0;border:1px solid var(--line);background:var(--panel);padding:24px;border-radius:10px}
.quiz h3{margin-top:0}
.quiz .qitem+.qitem{border-top:1px solid var(--line);margin-top:18px;padding-top:12px}
.quiz button{display:block;width:100%;text-align:left;margin:8px 0;font-size:13px}
.quiz button.correct{background:var(--ok-bg);border-color:var(--accent)}
.quiz button.wrong{background:var(--ng-bg);border-color:var(--ng)}
.feedback{font-size:13px;min-height:22px;margin-top:8px}
.exercise{padding:22px;background:var(--tint);border-radius:9px;margin:25px 0}
.exercise h3{margin-top:0}
.exercise .ex+.ex{margin-top:18px;padding-top:14px;border-top:1px solid var(--tint-2)}
.exercise .ex>p{font-size:13px;font-weight:600}
.exercise textarea{width:100%;min-height:80px;padding:10px 12px;border:1px solid var(--line);background:var(--panel);border-radius:7px;font-size:13px}
.exercise details{font-size:13px;margin-top:6px}
.exercise summary{cursor:pointer;color:var(--accent)}
.takeaways{border:1px solid var(--line);border-radius:10px;padding:18px 24px;background:var(--panel)}
.takeaways h3{margin:0 0 6px;font-size:15px}
.takeaways ul{margin:0;padding-left:1.2em}
.memo{margin:32px 0}
.memo label{display:block;font-size:13px;font-weight:600}
.memo textarea{width:100%;min-height:110px;padding:14px;border:1px solid var(--line);background:var(--panel);border-radius:8px}
.memo small{color:var(--muted);font-size:11px}
.lesson-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:35px 0;flex-wrap:wrap}
.lesson-bottom a{text-decoration:none;font-size:13px}
.print-only{display:none}
svg{max-width:100%;height:auto}

/* 分野マップ */
.field-page{max-width:930px;margin:auto}
.field-page h1{font-size:44px}
.field-page .summary{font-size:16px;color:var(--muted)}
.map-tools{display:flex;align-items:end;gap:10px;margin:30px 0 8px}
.map-tools label{flex:1;font-size:11px;color:var(--muted)}
.map-tools input{display:block;width:100%;margin-top:4px;font-size:13px}
.map-tools button{font-size:11px;padding:9px 12px}
#field-status{font-size:11px;color:var(--muted);margin:0 0 30px}
.map-root{display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--panel);border-radius:10px;padding:18px 22px}
.map-root b{display:block;font-size:18px}
.map-root small{opacity:.75;font-size:11px}
.field-tree{margin:0 0 40px 24px;border-left:1px solid var(--tint-2);padding:24px 0 0 30px}
.field-branch{position:relative;margin:0 0 24px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:23px}
.field-branch:before{content:'';position:absolute;left:-31px;top:40px;width:30px;height:1px;background:var(--tint-2)}
.branch-header{display:flex;align-items:center;gap:14px}
.branch-number{font:17px ui-monospace,monospace;color:var(--accent);background:var(--tint);border-radius:8px;padding:12px}
.branch-header h2{font-size:20px;margin:0;line-height:1.5}
.branch-header p{font-size:11px;color:var(--accent);margin:4px 0 0}
.branch-description{font-size:12px;color:var(--muted);margin:16px 0 20px}
.branch-items{margin-left:20px;border-left:1px solid var(--line);padding-left:20px}
.topic{position:relative;border-top:1px solid var(--line)}
.topic:before{content:'';position:absolute;left:-21px;top:25px;width:15px;height:1px;background:var(--line)}
.topic summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 0}
.topic summary::-webkit-details-marker{display:none}
.topic-name{font-weight:600;font-size:14px;flex:1}
.type-tag{font-size:9px;background:var(--tint);color:var(--accent);padding:2px 8px;border-radius:20px;white-space:nowrap}
.topic-plus{color:var(--accent);font-size:15px}
.topic[open] .topic-plus{transform:rotate(45deg)}
.topic-body{padding:0 12px 16px 0;font-size:12px}
.topic-body p{margin:5px 0 10px}
.topic-example{background:var(--tint-3);border-radius:5px;padding:11px 14px;color:var(--muted)}
.topic-body a{display:inline-block;font-size:11px;text-decoration:none;border-bottom:1px solid var(--tint-2)}
.topic-future{font-size:10px;color:var(--muted);display:block}
[hidden]{display:none!important}

footer{border-top:1px solid var(--line);padding:24px 38px;display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:10px}
#print-document{display:none}
.print-value{white-space:pre-wrap;border:1px solid #bbb;padding:6px 10px;font-size:11px;margin:4px 0 12px}
.print-choice{font-size:12px;margin:5px 0}
.print-intro{font-size:12px}

@media(min-width:1400px){main{padding:55px 7%}}
@media(max-width:1050px){main{padding:35px 4%}.hero{grid-template-columns:1fr}.hero-visual{max-width:550px}.phase{grid-template-columns:1fr}.phase-label{padding:0}.phase-label b{display:inline;margin-right:10px}.schedule{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){
  header{height:70px;padding:0 16px}.edition,.header-right .quiet{display:none}.brand{font-size:14px}.logo{width:34px;height:34px;font-size:20px}.home-link{font-size:11px;padding:5px 9px}
  .layout{display:block}
  aside{position:relative;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  .side-intro,.nav-phase{display:none}.search-label{margin:0}
  nav{display:flex;overflow:auto;margin-top:8px;padding-bottom:2px;gap:4px}
  .navitem{white-space:nowrap;margin:0;padding:7px 9px;font-size:11px}
  .progressbox{margin:8px 0 0;padding:0;border:0}.progressbox small{display:none}
  main{padding:30px 16px}
  .hero{gap:24px;min-height:0}h1{font-size:34px}.facts{gap:24px}
  .cards{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.chaptercard{min-height:150px;padding:15px}
  .sectionhead small{display:none}.lesson h1{font-size:28px}
  .flow{padding:16px 8px}.flow .node{padding:8px}.lab{padding:18px}
  .choice-cards{grid-template-columns:1fr}
  .sortlist li{grid-template-columns:1fr}
  footer{padding:20px 16px;display:block}
  .field-page h1{font-size:32px}.map-tools{flex-wrap:wrap}.map-tools label{flex-basis:100%}

 summary:'データがあっても、意味・更新時点・出所が分からなければ使えません。業務用語集、データ辞書、カタログ、リネージの役割を分けて学びます。',tags:['業務用語集','データ辞書','カタログ','リネージ'],
 goal:'業務・技術・運用メタデータを区別し、一つの指標に必要な説明と変更時の確認先を書ける。',
 sections:[
 ['数値だけでは意味が決まらない',prose('レポートに「顧客数：120」とだけ書かれていました。会員登録者なのか、今月購入した人なのか、企業の取引先数なのかで意味が変わります。<b>メタデータ</b>は、データを読み解くための説明です。','食品のラベルに原材料や期限があるように、データにも定義、対象期間、責任者、利用上の注意が必要です。データの量が増えるほど、この説明を探せることが重要になります。')+tree('顧客数 120',[['意味',['今月、出荷済み注文がある顧客の実人数']],['出所',['受注システム→月次集計']],['使う条件',['月末締め・翌営業日に更新']]])],
 ['メタデータは三つの視点で見る',table(['視点','記録する内容','例'],[['業務','定義・用途・責任者','有効顧客＝直近12か月に出荷実績あり'],['技術','テーブル・項目・型・関係','customer_id は顧客を識別する文字列'],['運用','実行時刻・更新結果・件数','最終更新は本日6時、取り込みは成功']])+prose('業務の説明と技術の項目を関連付けると、利用者は「この列で何を数えられるか」を理解できます。運用情報があれば、正しい定義でも更新が止まっているデータを見分けられます。')],
 ['用語集・辞書・カタログの役割',table(['成果物','答える問い','載せる例'],[['業務用語集','この言葉は何を意味する？','売上の計上条件、返品の扱い'],['データ辞書','この項目はどんな形？','項目名、型、許容値、空欄の可否'],['データカタログ','どこにあり、使える？','所在、オーナー、申請先、関連用語'],['リネージ','どこから来て、どう変わった？','元項目、加工処理、集計、利用先']])+prose('カタログは説明を見つける入口です。ツールで列名を自動収集しても、売上の業務定義や利用上の注意まで自動で正しく埋まるとは限りません。まず重要なデータから、人が説明と責任者を補います。')],
 ['リネージは変更の影響をたどる道筋',flow(['注文の金額','返品を除く','月ごとに集計','経営レポート'])+prose('レポートの数字から元データへさかのぼると、原因を調べられます。元項目から利用先へたどると、項目名や定義を変えた際の影響を調べられます。両方向で役立つ情報です。','ただし、線がつながっているだけでは変換の意味は分かりません。「税抜きへ変換」「取消済みを除外」などの処理も記録します。手作業の表計算や外部への配布など、ツールが拾えない流れも確認します。')],
 ['説明を更新する仕組みまで作る',prose('最初に用語集を作っても、その後の変更が反映されなければ古い説明が残ります。定義の変更申請、承認者、適用日、関連レポートの確認を、システムや業務の変更手順に組み込みます。','最小限の記録は「名前・定義・対象と除外・責任者・出所・更新頻度・利用上の注意」です。利用者からの質問を受け、説明を改善する窓口も用意します。説明の記載率だけでなく、必要なデータを見つけられるかを確かめましょう。')+note('同じ言葉に異なる正当な用途があるなら、無理に一つへ統合せず、「受注額」「計上売上」のように区別して関連付けます。')],
 ],
 example:{bad:'amount という列を見つけ、そのまま売上として集計する。税込か税抜きか、取消が含まれるかは確認しない。',good:'列を業務用語「税抜き計上売上」と結び付け、対象期間・除外条件・出所・更新時刻を確認して利用する。',why:'列があるだけでは意味は決まりません。業務・技術・運用の説明を組み合わせます。'},
 labs:[classification('説明の種類を分ける','各説明が主にどの視点か選びます。',['業務メタデータ','技術メタデータ','運用メタデータ'],[['有効顧客は直近12か月に出荷実績のある顧客',0,'業務上の言葉の意味です。'],['注文番号は文字列で、空欄を許可しない',1,'項目の形式と制約です。'],['取り込みが本日6時に失敗した',2,'実行状態の記録です。'],['返品は計上売上から差し引く',0,'指標の業務定義です。']])],
 quiz:[['業務用語集が主に答える問いは？',['サーバーの容量は？','この言葉は何を意味する？','誰が昨日ログインした？'],1,'業務の言葉を同じ意味で使うための説明です。'],['元項目の変更で影響するレポートを探すには？',['リネージをたどる','名前順に並べる','データを削除する'],0,'加工と利用先のつながりから影響を調べます。'],['カタログ導入後に必要な活動は？',['一度登録したら終了','列名だけ集める','定義の責任者と更新手順を決める'],2,'説明もデータと同じく維持が必要です。']],
 exercise:[{q:'「月間購入顧客数」の説明を、対象・期間・除外条件・責任者を含めて書いてください。',a:'当月に出荷した注文の顧客を顧客ID単位で重複なく数える。取消のみの注文は除外。月末締め、翌営業日更新。定義の承認者は販売企画責任者。'},{q:'注文の金額項目を変更するとき、どの利用先を確認しますか。',a:'受注→売上集計→BI→経営レポートの流れに加え、請求処理、個別の表計算、外部への配布を確認する。変換条件と変更の適用日も記録する。'}],
 takeaways:['メタデータはデータを正しく読むための説明','用語集・辞書・カタログ・リネージはそれぞれ役割が違う','登録だけで終わらず、変更手順と責任者を持つ'],sources:['dmbokjp','purview']
},
{
 area:'base',title:'データ品質',subtitle:'目的に合う品質を決め、測り、原因から改善する',time:45,
 summary:'空欄や誤りを直すだけでなく、利用目的から品質の条件を決め、発生する原因へ戻って改善する流れを学びます。',tags:['品質の観点','プロファイリング','品質ルール','原因分析'],
 goal:'完全性・妥当性・正確性などの違いを例で説明し、品質ルールと原因に対する改善策を作れる。',
 sections:[
 ['品質は、使う目的から決まる',prose('配送には番地までの住所が必要ですが、都道府県別の傾向を見る分析では都道府県だけで足りることがあります。<b>データ品質</b>は、すべての項目を完璧にすることではなく、使う目的に必要な状態を保つことです。','配達先が空欄の注文を出荷してしまう場面では、欠けている住所だけでなく、出荷前に止める確認も問題になります。業務への影響、発生頻度、直す費用を見て重要な項目から改善します。')],
 ['品質を見る観点を分ける',table(['観点','問い','住所や注文の例'],[['完全性','必要な値がある？','配送に必要な番地が入っている'],['妥当性','決めた形式・範囲に合う？','郵便番号が許容した形式に合う'],['正確性','現実の事実と合う？','住所が実際の配送先と合う'],['一意性','同じ対象が重複していない？','同じ注文番号が二重登録されていない'],['整合性','関連する値と矛盾しない？','注文の顧客IDが顧客台帳に存在する'],['適時性','必要な時点に間に合う？','出荷前に住所変更が反映される']])+note('形式が正しい郵便番号でも、実際の住所と一致するとは限りません。妥当性のチェックだけで正確性を保証することはできません。')],
 ['まず観察し、ルールを具体化する',prose('<b>プロファイリング</b>は、値の分布や空欄、重複、想定外の値を調べ、データの現状を知る活動です。問題らしい値を見つけても、すぐに削除せず、業務上の例外か入力ミスかを確かめます。','品質ルールは対象と条件を明記します。「住所をきれいにする」では測れません。「配送が必要な確定注文には、都道府県・市区町村・番地が入っている」なら、チェック対象が決まります。')+table(['ルールの要素','例'],[['対象','配送が必要な確定注文'],['条件','配送先の必須項目が空欄でない'],['確認タイミング','注文確定時と出荷前'],['問題の扱い','出荷を保留し、受付担当に通知'],['責任者','受注業務のオーナー']])],
 ['修正と再発防止は別の活動',flow(['影響を止める','問題を調べる','元データを修正','発生原因を改善','再測定'])+prose('欠けた住所を担当者が調べて埋めるのは修正です。住所を任意入力にしていた画面を見直すのは再発防止です。毎月、同じ掃除をしているなら、データが生まれる場所へ戻って考えます。','誤りの原因は入力だけとは限りません。取り込みで桁が失われた、コードの対応表が古い、更新が届かないなど、加工や連携の途中でも起きます。原因を確認せず推測で値を補うと、新しい誤りを作ります。')],
 ['品質を、業務への影響と一緒に見る',prose('空欄が少なくても、重要な注文だけで起きていれば影響は大きくなります。チェック件数、問題件数、影響した業務、未解消の期間を並べて追います。単なる全項目の平均点だけで判断しないようにします。','基準を満たさないデータは、用途に応じて利用を止める、注意を表示する、別の確認を入れるなどの扱いを決めます。改善後は同じ対象と条件で再測定し、問題が別の項目へ移っていないかも確認します。')],
 ],
 example:{bad:'空欄をすべて「不明」で埋め、空欄率がゼロになったので品質が改善したと報告する。',good:'配送が必要な注文を対象に住所の不足を測り、出荷を保留する。確認済みの住所を登録し、入力画面と受付手順を改善する。',why:'見かけの空欄率ではなく、業務で使える状態と再発防止を確認しています。'},
 labs:[classification('どの品質の問題？','ここでは主に確認する観点を一つ選びます。',['完全性','妥当性','正確性','一意性','適時性'],[['配送先の番地が空欄',0,'必要な値が欠けています。'],['郵便番号に文字「ABC」が入っている',1,'許容した形式に合いません。'],['形式は正しいが別人の住所だった',2,'現実の事実と違います。'],['同じ注文番号が二重に登録された',3,'一つの対象が重複しています。'],['住所変更が出荷後に反映された',4,'必要な時点に間に合っていません。']])],
 quiz:[['正しい形式の住所であることは、何を保証する？',['実際の住所との一致','形式の妥当性','更新が最新であること'],1,'形式チェックだけでは現実との一致や新しさは保証しません。'],['毎月同じ空欄が出る場合の次の一手は？',['発生源と連携処理を調べる','推測した値で埋める','チェックをやめる'],0,'修正に加えて原因を変える必要があります。'],['品質基準を決める出発点は？',['全項目を同じ点数にする','ツールの標準設定','利用目的と業務への影響'],2,'必要な品質は使い方によって違います。']],
 exercise:[{q:'メール配信に使う連絡先データについて、測定できる品質ルールを作ってください。',a:'配信対象として承認された顧客のメールアドレスが必須で、許容形式に合うことを配信前に確認。不備は配信から保留し担当へ通知。形式の妥当性と実際に届くことは別に確認する。'},{q:'郵便番号の先頭のゼロが連携後に消える問題について、修正と再発防止を分けてください。',a:'修正：元データと照合し、確認できた正しい値へ戻す。再発防止：数値として読み込む処理を見直し、文字列として保持する。先頭ゼロのサンプルで連携を確認する。'}],
 takeaways:['品質は目的に対して十分に使えるかで判断する','妥当性と正確性を混同しない','問題の修正と、発生源に戻る再発防止を組み合わせる'],sources:['dama','dmbokjp','constraints']
},
{
 area:'build',title:'データアーキテクチャ',subtitle:'全体の流れと役割から、変化に強い設計を考える',time:40,
 summary:'データがどこで生まれ、どこへ流れ、誰が使うか。製品名から入るのではなく、業務の要求とデータの流れから全体の設計を考えます。',tags:['現状と将来像','データフロー','正とする情報源','設計原則'],goal:'データの作成・連携・利用の流れを描き、正とする情報源、複製、更新の責任を説明できる。',
 sections:[
 ['箱を並べる前に、目的を決める',prose('<b>データアーキテクチャ</b>は、組織全体でデータをどう配置し、つなぎ、利用するかの設計です。サーバーや製品の一覧だけでは、データの役割や重複は分かりません。','架空の販売業務では、EC、店舗、請求がそれぞれ住所を持っていました。最初に「住所変更を出荷に間に合わせたい」という目的を置くと、どこで受け付け、どこへ反映すべきかを考えられます。')],
 ['現状のデータフローを描く',flow(['顧客が住所を変更','顧客台帳を更新','配送用の複製に反映','倉庫が出荷に利用'])+table(['確認するもの','問い'],[['作成元','誰がどの業務で入力する？'],['正とする情報源','食い違ったときに何を基準にする？'],['連携','いつ、何を、どの条件で渡す？'],['利用先','どの業務や判断に使う？'],['責任','更新の失敗を誰が確認する？']])+prose('図には矢印だけでなく、更新頻度と担当も添えます。台帳から配送データへの連携が夜だけなら、昼の変更が当日の出荷に間に合わない可能性があります。')],
 ['正とする情報源と、利用用の複製を分ける',prose('全データを一か所に置けば解決するとは限りません。業務を止めずに分析するため、または利用先の処理に合わせるために、複製が必要なこともあります。重要なのは、複製を勝手に別の正本へ変えないことです。','住所は顧客台帳、支払状態は請求システムなど、項目ごとに正とする情報源が異なる場合があります。「このシステムが全部正しい」と一括で決めず、対象と更新権限を明確にします。')+note('「正とする情報源」は管理上の基準です。元システムの入力にも誤りはあり得るので、品質の確認は別に必要です。')],
 ['将来像は、要求の違いを受け止める',table(['要求','設計で考えること'],[['出荷前に最新の住所が必要','連携の遅れと失敗時の扱い'],['前年との比較がしたい','履歴を保つ場所と期間'],['個人情報を必要な人だけが使う','閲覧範囲、権限、提供項目'],['業務が止まると困る','復旧手順、代替処理、監視']])+prose('すべてを即時連携すると、複雑さや運用負担も増えます。翌日でよい分析と、出荷前に必要な確認では要求が違います。要求の理由を残せば、設計の選択を後から見直せます。')],
 ['移行を、段階と確認条件で進める',flow(['現状を確認','将来像を描く','一つの連携を改善','旧方式と照合','段階的に切り替える'])+prose('設計図だけで終わらず、どのデータから変えるか、旧方式とどう照合するか、失敗したらどう戻すかを決めます。件数が一致しても、対象期間や項目の意味が違う可能性があるので、内容も確認します。','図は移行後も更新します。現場の手作業や新しい配布先が増えているのに図が古いままでは、変更の影響を判断できません。')],
 ],example:{bad:'最新の基盤へ全データを集めることを先に決め、更新時点や誰が直すかは後で考える。',good:'住所変更を出荷前に反映する要求から、台帳・連携・倉庫の流れと責任を整理し、必要な連携だけを改善する。',why:'業務要求が先にあると、設計の必要性と合格条件を説明できます。'},
 labs:[classification('どの設計上の問い？','困りごとに最も近い問いを選びます。',['正とする情報源','更新の新しさ','履歴の保持','責任と運用'],[['顧客台帳と配送データの住所が違う',0,'どこを基準に修正するかを明確にします。'],['昼の変更が翌日まで反映されない',1,'必要な時点に届く流れかを確認します。'],['去年の住所で地域別分析をしたい',2,'最新値だけでなく当時の情報が必要です。'],['連携停止の通知先がない',3,'検知後に行動する担当が必要です。']])],
 quiz:[['アーキテクチャ設計の出発点は？',['業務の目的とデータ要求','製品の人気','図の見栄え'],0,'要求から配置や連携の役割を決めます。'],['利用用の複製を作るときに必要なのは？',['すべてを手入力にする','正とする情報源と更新ルール','元データの責任者をなくす'],1,'基準と更新方法がなければ食い違いが放置されます。'],['移行の合格確認として適切なのは？',['新基盤が起動しただけ','件数だけ合う','意味・件数・更新・戻し方を確認'],2,'業務で使える状態まで確認します。']],
 exercise:[{q:'住所変更が配送へ届く流れを、作成元・正本・連携・利用先で描いてください。',a:'受付→顧客台帳（住所の基準）→配送用データへの連携→倉庫。各矢印に更新時刻、失敗時の通知先、出荷前の確認を書き添える。'},{q:'翌日更新でよいデータと、業務中の更新が必要なデータを一つずつ挙げてください。',a:'月次傾向分析は翌日更新でも支障が小さい場合がある。出荷直前の配送先変更は出荷前に反映が必要。どちらも業務側と遅延の許容範囲を確認する。'}],takeaways:['全体の設計は業務の目的とデータの流れから考える','複製の必要性と、基準にする情報源を明確にする','将来像・移行手順・日々の運用をつなぐ'],sources:['dama','dmbokjp']
},
{
 area:'build',title:'データモデリングとデザイン',subtitle:'業務の事実を、対象・関係・一行の意味で表す',time:45,
 summary:'「注文には商品が複数ある」をどんなデータで表すか。対象、識別子、関係、一行の意味を、注文の具体例で学びます。',tags:['エンティティ','識別子','関係','粒度','正規化'],goal:'顧客・注文・注文明細・商品の関係を説明し、一行の意味と重複による更新の問題を見分けられる。',
 sections:[
 ['業務で扱う対象と、起きる出来事',prose('<b>データモデル</b>は、業務で扱う対象と、その属性や関係を表したものです。顧客や商品は対象、注文は業務で起きる出来事として整理できます。最初から列名やデータベース製品を考える必要はありません。','一つの注文にノートとペンが含まれるなら、「注文」と「商品」は単純な一対一ではありません。「何個・いくらで買ったか」は商品の固定情報ではなく、注文の明細に属する情報です。')+flow(['顧客','注文','注文明細','商品'])],
 ['一行は、何を表す？',table(['表','一行の意味','主な項目'],[['顧客','一人の顧客','顧客ID、氏名、連絡先'],['注文','一回の注文','注文ID、顧客ID、注文日'],['注文明細','注文に含まれる一つの明細','注文ID、明細番号、商品ID、数量、販売単価'],['商品','一つの商品','商品ID、商品名、現在の標準価格']])+prose('この「一行が表す単位」を<b>粒度</b>と呼びます。注文の金額と明細の金額を同じ粒度だと思って足すと、注文全体の金額を商品数だけ重複して数えることがあります。まず一行の意味を言葉で書きましょう。')],
 ['名前ではなく識別子でつなぐ',prose('同じ氏名の人や、名前が変わる商品があります。氏名や商品名を識別の基準にすると、別人を同一人物と扱ったり、名前変更で関係が切れたりします。','<b>主キー</b>は行を識別するために選ぶ項目、<b>外部キー</b>は他の表の行と関係を持たせる項目です。注文の顧客IDが顧客の表を参照すれば、どの顧客の注文かを結び付けられます。')+note('注文明細は「注文IDと明細番号」の組で識別できます。同じ商品が一つの注文に複数回現れる業務もあるので、商品IDだけで明細を識別しないようにします。')],
 ['関係の数と、存在しなくてもよいかを考える',table(['業務ルールの例','関係の読み方'],[['一人の顧客は、注文をまだ持たないこともある','顧客→注文：ゼロ件以上'],['会員向け業務では、一つの注文に顧客が一人いる','注文→顧客：一人'],['確定した注文には、一つ以上の明細がある','注文→明細：一件以上'],['一つの商品は、複数の明細で使われる','商品→明細：ゼロ件以上']])+prose('ゲスト購入を認めるなら顧客が必須とは限りません。関係の数は、実際の業務ルールで決まります。図に描くことで、暗黙の前提を業務担当者と確認できます。')],
 ['重複を減らし、履歴として必要な値は残す',prose('毎回の注文行に顧客の現在の連絡先をコピーすると、変更時に全部直す必要が生じます。対象ごとに情報を分け、識別子でつなぐ<b>正規化</b>は、このような更新の矛盾を減らす考え方です。','一方、注文時点の販売単価や配送先は、後で現在の値が変わっても当時の事実として残す必要があります。「同じ値があるから全部消す」のではなく、現在の基本情報と取引時点の記録を区別します。')+table(['モデルの段階','主に考えること'],[['概念モデル','顧客・注文など業務の対象と関係'],['論理モデル','属性・キー・関係・制約'],['物理モデル','実装する型・配置・索引など']])],
 ],example:{bad:'注文一行に商品1・商品2・商品3の列を用意し、商品が増えたら列も増やす。',good:'注文と注文明細を分け、明細ごとに商品・数量・注文時点の販売単価を記録する。',why:'一行の意味が明確になり、商品数が変わっても同じ構造で扱えます。'},
 labs:[classification('どの表に置く？','架空の会員向け販売業務のモデルです。',['顧客','注文','注文明細','商品'],[['顧客の現在の連絡先',0,'顧客の基本属性です。'],['注文を受け付けた日',1,'注文全体の情報です。'],['この注文でペンを買った数量',2,'個々の購入明細の情報です。'],['商品の現在の標準価格',3,'取引時点の販売単価とは別の基本情報です。']])],
 quiz:[['注文明細の一行が表すのは？',['一人の顧客','一つの注文に含まれる明細','全商品の一覧'],1,'一行の単位をそろえることが重要です。'],['同名の顧客を区別するには？',['氏名だけを使う','表示順を使う','顧客IDなどの識別子を使う'],2,'名前は重複や変更があり得ます。'],['注文時点の単価を残す理由は？',['後の価格変更で過去の取引が変わらないようにする','同じ値を増やすため','現在価格を更新しないため'],0,'基本情報と取引の事実を区別します。']],
 exercise:[{q:'注文に「ノート2冊、ペン3本」がある場合、注文と注文明細の行数を説明してください。',a:'注文は一行、明細は通常二行。各明細に商品IDと数量を置く。同じ商品を別の明細に分ける業務なら、そのルールも確認する。'},{q:'商品名変更で過去のレポートまで変わる場合、何を確認しますか。',a:'現在の名称で分析したいか、当時の名称を表示したいかを確認する。当時の表示が必要なら、履歴や取引時点の名称を保持する方法を設計する。'}],takeaways:['対象・属性・関係を、業務の言葉から整理する','識別子と、一行の意味を先に決める','現在の基本情報と取引時点の事実を分ける'],sources:['dmbokjp','constraints']
},
{
 area:'build',title:'データストレージとオペレーション',subtitle:'保存するだけでなく、動かし続け、復旧できる状態を保つ',time:40,
 summary:'バックアップが成功していても復元できるとは限りません。保存・監視・変更・障害対応を、業務を続けるための活動として学びます。',tags:['バックアップ','復旧','RPO','RTO','監視','変更管理'],goal:'バックアップと復旧、RPOとRTOの違いを説明し、復元確認を含む運用チェックを作れる。',
 sections:[
 ['保存できた、だけでは業務は続かない',prose('データを保管する仕組みは、日々の入力や読み取りを受け付け、必要な時間に使える状態を保つ必要があります。容量不足、処理の遅れ、設定変更、障害などは、データが失われなくても業務を止める原因になります。','運用では、正常な状態、異常を検知する条件、通知先、復旧手順を合わせて決めます。監視画面を見る人がいても、何をすべきか分からなければ復旧にはつながりません。')],
 ['バックアップ・複製・アーカイブの違い',table(['仕組み','主な目的','注意点'],[['バックアップ','障害や誤操作から過去の状態を復元する','必要な時点に戻せるかを確認する'],['複製・レプリカ','別の場所でも処理や参照を可能にする','誤った削除が複製先へ届くこともある'],['アーカイブ','頻繁に使わない記録を長期保管する','探して読み出せる方法が必要']])+prose('複製があるからバックアップは不要、と判断すると、元と複製先が同じ誤操作の影響を受ける場合があります。想定する障害や誤操作に対して、何を戻せる仕組みかを確認します。')],
 ['どこまで戻し、いつまでに使えるようにする？',table(['用語','意味','架空の要求'],[['RPO：目標復旧時点','どの時点までのデータを復元する必要があるか','注文の損失は最大15分分まで'],['RTO：目標復旧時間','停止からどれくらいで業務を再開する必要があるか','2時間以内に注文受付を再開']])+prose('前日分に戻せるだけでは、直前までの注文が必要な業務に合いません。逆に、過剰に短い目標は費用や運用の負担を増やします。業務への影響を確認して要求を決めます。','目標値が書いてあるだけでは達成の証拠になりません。復元、設定や権限の確認、アプリからの利用確認まで含めて、実際にかかる時間を測ります。')],
 ['バックアップの成功と復元の成功を確かめる',flow(['取得する','別の環境へ復元','件数と内容を確認','業務の操作を確認','時間と結果を記録'])+prose('バックアップのファイルが存在しても、必要なログや暗号鍵が欠けていれば戻せない場合があります。復元手順が特定の担当者の記憶に依存していることもあります。','復元の訓練では、想定する障害を決め、どの時点まで戻ったか、どの業務が動いたかを確認します。訓練用のデータと環境を用意し、本番の利用者やデータへ影響しない手順で行います。')],
 ['日々の監視と変更を、復旧につなぐ',table(['監視する対象','通知後の行動例'],[['容量の残り','増加傾向を確認し、追加や削除を計画'],['処理時間','いつから遅いか、対象件数や変更を確認'],['バックアップ結果','再取得と復元可能な時点を確認'],['権限や構成の変更','承認内容と差分、影響を確認']])+prose('変更は手順、担当、実施時刻、確認条件、戻し方を決めて行います。障害対応の記録から、監視で気付けなかった点や手順の不足を改善し、次の運用へ反映します。')],
 ],example:{bad:'毎日バックアップの成功ログがあるので、復元したことはないが「復旧できる」と報告する。',good:'別環境で復元し、必要な時点の注文と業務操作を確認する。かかった時間と不足した手順を記録する。',why:'取得できたことと、必要な状態へ戻せることは別です。復元の実績で確かめます。'},
 labs:[{type:'checklist',title:'復旧の準備を点検する',intro:'できている項目を選ぶと、残る確認事項が変わります。この教材用チェックは復旧能力を保証するものではありません。',items:['業務側と必要な復旧時点・時間を決めた','必要なデータ・ログ・鍵を把握した','復元手順と担当を明文化した','別環境で復元と業務操作を確認した','訓練結果を記録し、不足を改善した'],render:(n,total,v)=>`<p><b>${n} / ${total} 項目を確認</b></p><p>${!v[3]?'まだ実際の復元確認がありません。成功ログだけでは、業務を戻せるか判断できません。':n===total?'次は変更後も同じ手順で復元できるか、定期的に確認します。':'復元確認に加え、目標・必要な資材・担当・結果の記録をそろえましょう。'}</p>`}],
 quiz:[['RPOが表すのは？',['復旧作業の人数','戻す必要があるデータの時点','サーバー容量'],1,'どの時点まで復元する必要があるかの目標です。'],['複製がバックアップの代わりにならない理由は？',['複製には常に意味がない','バックアップは必ず即時','誤削除が複製先にも反映される場合がある'],2,'同じ誤操作の影響を受ける可能性があります。'],['復旧の合格確認に含めるものは？',['業務操作と復旧時間','取得ログだけ','ファイル名だけ'],0,'必要なデータと業務が戻ることを確かめます。']],
 exercise:[{q:'前日夜のバックアップしかないのに、RPOが15分の場合、何を確認しますか。',a:'要求と現在の方式が合っていない。より直近まで戻すためのログや取得方式の有無、費用と運用、業務上の代替手順を確認し、要求または方式を見直す。'},{q:'復元訓練の記録に残す項目を挙げてください。',a:'障害の想定、対象データ、復元した時点、開始と完了、業務操作の結果、不足した鍵や手順、担当、次の改善と期限。'}],takeaways:['保管と運用は、業務が使える状態を保つ仕事','RPOは復旧時点、RTOは復旧時間の目標','取得ログだけで判断せず、復元と業務操作まで確認する'],sources:['dmbokjp','backup']
},
{
 area:'build',title:'データセキュリティ',subtitle:'必要な利用を可能にし、権限と使い方を管理する',time:40,
 summary:'誰が、何のために、どこまで使えるか。分類・権限・記録・見直しを組み合わせ、データを使いながら守る考え方を学びます。',tags:['機密性','完全性','可用性','最小権限','プライバシー'],goal:'守る対象と許可する操作を整理し、最小権限と権限の見直しを説明できる。',
 sections:[
 ['何を守り、何を可能にする？',table(['観点','守る状態','例'],[['機密性','必要な人だけが使える','配送担当には担当する注文の住所だけを見せる'],['完全性','許可なく改変されない','口座情報の変更に承認を入れる'],['可用性','必要なときに使える','障害時にも受注業務を再開できる']])+prose('使えなくすれば安全、とは限りません。業務に必要な利用を可能にしながら、不正な閲覧・改変・停止を防ぎます。まずどのデータを誰がどの目的で使うかを確認します。')],
 ['分類から、扱い方を決める',prose('公開情報、組織内情報、機密情報など、組織に合う分類を決めます。分類ラベルだけでは保護にならないため、共有先、持ち出し、保管、廃棄などの扱い方と結び付けます。','同じ顧客データでも、氏名・連絡先が必要な配送と、地域ごとの傾向を見たい分析では必要な項目が違います。不要な項目を提供しないことも、守るための設計です。')+flow(['データを分類','利用目的を確認','必要な項目と操作を許可','利用を記録','見直す'])],
 ['本人確認と、操作の許可を分ける',prose('<b>認証</b>は誰かを確認すること、<b>認可</b>はどの操作を許すかを判断することです。ログインできることと、全データを閲覧できることは別です。','<b>最小権限</b>は業務に必要な範囲だけを許可する考え方です。閲覧と更新、担当範囲と全社範囲、通常時と緊急時を分けます。共通アカウントでは誰が操作したか分からなくなるため、操作主体を追えるようにします。')+table(['業務','権限の例'],[['配送担当','担当注文の配送先を閲覧'],['顧客受付','承認された手順で住所を更新'],['分析担当','目的に必要な項目を閲覧'],['緊急対応','承認・期限・操作記録付きで追加権限']])],
 ['付与した権限は、異動や終了時に見直す',prose('権限は申請時だけでなく、異動、退職、委託終了、業務変更でも見直します。異動後に前部署の権限が残れば、新しい業務に不要なデータを見られる状態になります。','定期的な棚卸しでは、アカウントがあるかだけでなく、何を許可されているか、今も必要か、誰が承認したかを確認します。記録したアクセスログも、何を検知し誰が対応するかを決めて利用します。')],
 ['暗号化だけで、使い方の問題は解決しない',prose('暗号化は、読めない状態で保管・送信するための対策です。ただし正規の権限で取り出したデータの目的外利用や誤送信まで防ぐとは限りません。権限、持ち出しの手順、教育、監視と組み合わせます。','<b>プライバシー</b>は、個人に関するデータをどの目的で集め、使い、共有するかにも関わります。閲覧権限があるだけでどんな用途にも使えるわけではありません。具体的な法令上の要件は、個人情報保護委員会の資料と担当部署で確認します。')+note('この章は概念の学習です。保存期間や本人同意の要否を、すべてのデータに一律で決めるものではありません。')],
 ],example:{bad:'部署で共通アカウントを使い、念のため全員に顧客台帳の更新権限を付けたままにする。',good:'担当業務に合わせて閲覧・更新の範囲を分け、本人ごとの操作を記録する。異動や業務終了で権限を見直す。',why:'必要な利用範囲と操作主体を明確にし、不要になった権限を減らしています。'},
 labs:[classification('対策の目的を見分ける','最も直接の目的を選びます。',['機密性','完全性','可用性'],[['担当者だけが住所を閲覧できるようにする',0,'閲覧する範囲を制限します。'],['支払先の変更を承認制にする',1,'許可のない改変を防ぐ対策です。'],['障害時の代替受付手順を用意する',2,'必要な業務を続けるための対策です。'],['分析用データから不要な連絡先を除く',0,'提供範囲を減らし、不要な露出を防ぎます。']])],
 quiz:[['認可が判断するのは？',['利用者が誰かだけ','どの操作を許可するか','データの更新時刻'],1,'認証した利用者に許す範囲を決めます。'],['最小権限の考え方は？',['業務に必要な範囲だけ許す','全員に管理者権限','一度付与したら永久に維持'],0,'利用目的と担当の変化に応じて見直します。'],['暗号化したデータなら？',['目的外利用も必ず防げる','権限の棚卸しは不要','利用目的や権限の管理も必要'],2,'暗号化だけで扱い方のすべては管理できません。']],
 exercise:[{q:'配送担当と地域分析担当に、顧客データのどの項目を提供しますか。',a:'配送担当には担当注文の氏名・住所など配送に必要な項目。地域分析担当には目的に足りる地域情報などを検討し、不要な氏名・連絡先は提供しない。'},{q:'異動時の権限見直しを、通知・担当・確認で設計してください。',a:'人事上の異動を契機に、旧業務の責任者と新業務の責任者が必要範囲を確認。運用担当が削除・付与し、変更結果と承認者を記録する。'}],takeaways:['機密性・完全性・可用性を用途に合わせて守る','認証と認可を分け、必要な範囲の権限を与える','異動・終了・定期確認で権限を見直す'],sources:['dmbokjp','privilege','ppc']
},
{
 area:'use',title:'データ統合と相互運用性',subtitle:'運ぶだけでなく、意味・順序・再送の扱いをそろえる',time:45,
 summary:'二つのシステムがつながっていても、意味や処理結果が一致するとは限りません。変換、連携の約束、失敗時の再送を含めて学びます。',tags:['ETL・ELT','API','バッチ','冪等性','照合'],goal:'形式と意味の変換を区別し、二重登録を防ぐ再送と連携後の照合を説明できる。',
 sections:[
 ['つながった、だけでは同じ意味にならない',prose('システムAの「顧客」は購入した人、システムBでは登録した会員でした。列名をそろえて運んでも、対象が違えば同じ顧客数にはなりません。<b>統合</b>ではデータを取り込み、形式と意味を整えます。<b>相互運用性</b>では、異なる仕組みが受け渡した情報を共通の理解で使えることを目指します。','注文を再送して二件になる場面では、通信が成功するかだけでなく、同じ注文をどう見分けるかが重要です。つなぐ相手と「何を渡したら、何が起こるか」を約束します。')],
 ['取り込み・変換・配置を分けて考える',flow(['取得する','項目と意味を確認','形式を変換','利用先へ配置','結果を照合'])+table(['方式','流れ','考えること'],[['ETL','取り出す→変換→格納','格納前に必要な形へ整える'],['ELT','取り出す→格納→変換','格納先で変換し、元の情報も管理する']])+prose('どちらも品質や責任者が不要になるわけではありません。郵便番号を文字列として保持する、金額の通貨や税込・税抜きをそろえる、時刻の基準を合わせるなど、利用に必要な変換を決めます。元の値を残す場合は保管目的やアクセス範囲も決めます。')],
 ['頻度と受け渡しの約束を決める',table(['つなぎ方','特徴','確認すること'],[['バッチ','まとめて定期的に渡す','締め時刻、対象範囲、遅れたデータ'],['API','要求に応じて情報や処理を受け渡す','応答、権限、失敗時の扱い'],['イベント','起きた変化を通知する','順序、重複、取りこぼしへの対処']])+prose('日付の形式、必須項目、コードの意味、変更時の通知、許容する遅れ、担当を記録します。項目の追加でも、受け手が想定していない形式なら処理が止まる場合があります。送り手だけで変更を決めず、利用先との合意を持ちます。')],
 ['再送しても二重登録しない',prose('注文を送った後で通信が切れると、受け手が登録したのに送り手は成功を確認できないことがあります。そのまま同じ注文を新規登録すると二重になります。','<b>冪等性</b>は、同じ要求を繰り返しても意図した結果が重複して増えない性質です。同じ注文を表す識別子を渡し、受け手が処理済みか確認するなどの方法で扱います。別の注文まで同一と扱わないように、識別の範囲も決めます。')+flow(['注文ID付きで送信','応答を確認できない','同じIDで再送','処理済みなら重複を防ぐ'])+note('これは再送の概念を表す図です。実装では処理済み記録の保存期間や同時処理、内容の違う再送も考慮します。')],
 ['件数・内容・遅れを照合する',prose('ジョブが成功しても、一部の行が除外されている場合があります。送り手の対象件数、受け手の取り込み件数、除外や重複の件数、未処理を照合し、差の理由を説明できるようにします。','欠けたデータを隔離する場合は、元のデータ、理由、修正担当、再取り込み方法を記録します。エラーを無視して先へ進むだけでは、利用先で初めて問題に気付くことになります。')],
 ],example:{bad:'応答がない注文を毎回新しい番号で再送し、ジョブの成功ログだけを見て終了する。',good:'同じ注文を識別できるIDで再送し、処理済みを確認する。送信・受信・除外件数を照合し、不明な差を調べる。',why:'通信の成功だけでなく、業務上の結果が一度だけ反映されることと取りこぼしを確認します。'},
 labs:[classification('どの連携の問題？','主な問題の種類を選びます。',['形式','意味','重複と再送','照合と監視'],[['郵便番号の先頭ゼロが消えた',0,'数値と文字列の扱いなどを確認します。'],['会員数を購入顧客数として受け取った',1,'対象の定義が違います。'],['通信失敗で同じ注文が二件になった',2,'同じ要求を識別して重複を防ぎます。'],['成功ログはあるが百件足りない',3,'除外や未処理を含めて件数を照合します。']])],
 quiz:[['連携で列名が同じなら？',['必ず同じ意味','定義や対象を確認する','すべて変換不要'],1,'形式と意味は別々に確認します。'],['応答がない注文を再送する際に重要なのは？',['必ず新しい注文番号','送信時刻だけ','同じ注文と識別して重複を防ぐ'],2,'処理済みでも結果が増えないように扱います。'],['ジョブ成功後の確認として適切なのは？',['対象・取り込み・除外件数と内容の照合','成功ログだけを見る','元データを直ちに消す'],0,'処理結果が期待する業務の結果と合うか確認します。']],
 exercise:[{q:'郵便番号と注文金額を別システムへ渡す際の約束を挙げてください。',a:'郵便番号の文字列形式と先頭ゼロ、金額の通貨と税込・税抜き、注文ID、必須項目、取消の扱い、更新頻度、失敗時の通知・再送を決める。'},{q:'一千件を送り、九百八十件を取り込んだ場合、残り二十件について何を調べますか。',a:'除外、処理済みの重複、未処理、失敗の内訳を確認する。各対象の理由を追い、必要な修正と再取り込みを担当・期限付きで行う。'}],takeaways:['統合は形式に加えて意味もそろえる','頻度・識別子・変更・失敗時の約束を持つ','再送の重複防止と、取り込み後の照合を組み合わせる'],sources:['dmbokjp','retries']
},
{
 area:'use',title:'参照データとマスターデータ',subtitle:'同じ対象を見分け、基本情報とコードを管理する',time:45,
 summary:'同名の人を一人にまとめてしまわないために。マスター、参照データ、取引データの違いと、名寄せ・正とする値・変更の配布を学びます。',tags:['マスター','参照データ','名寄せ','ゴールデンレコード','コード管理'],goal:'三種類のデータを区別し、同一対象の判定と属性ごとの正とする値を説明できる。',
 sections:[
 ['基本情報・区分・出来事を分ける',table(['種類','何を表す？','例'],[['マスターデータ','業務で共有する基本的な対象','顧客、商品、組織'],['参照データ','分類や状態に使う値の集合','都道府県コード、注文状態'],['取引データ','業務で起きた出来事','注文、出荷、支払']])+prose('顧客の名前や連絡先は基本情報、注文は出来事、注文状態のコードは区分です。共有する情報を、同じ意味と識別子で使えるようにすることが重要です。分類は利用の仕方にも依存するので、業務の目的と合わせて決めます。')],
 ['同じ名前は、同じ対象とは限らない',prose('二つのシステムに同じ名前の顧客がいても、別人かもしれません。逆に表記が違っても同じ顧客の場合があります。<b>名寄せ</b>は、複数の記録が同じ対象を表すか判断し、関連付ける活動です。','名称だけでなく、確認済みの識別情報など、使ってよい手がかりを組み合わせます。判断が曖昧な候補は人の確認へ回し、自動的に全部まとめないようにします。誤って統合すると、別人の取引や連絡先が混ざるためです。')+flow(['記録を集める','表記を整える','同一候補を探す','曖昧な候補を確認','共通IDで関連付ける'])],
 ['正とする値は、項目ごとに決める',prose('営業台帳とECで同じ顧客だと分かっても、住所や電話番号が異なる場合があります。統合した代表情報を<b>ゴールデンレコード</b>と呼ぶことがありますが、すべての値を一つのシステムから選ぶ必要はありません。','住所は本人が直近に確認した値、契約区分は契約管理の値など、項目の性質で基準を決めます。単に更新時刻が新しい値を選ぶと、移行作業の時刻だけが新しい古い情報を採用する場合があります。')+table(['項目','選び方の例','残す記録'],[['住所','本人確認済みの最新情報','確認日、出所、更新担当'],['契約区分','契約管理の正式な記録','適用日と承認'],['名称','正式名称と別名を併存','正式名、検索用の別名']])],
 ['参照コードには意味と有効期間を持たせる',prose('コード「01」の意味がシステムによって違えば、値が届いても解釈を誤ります。コード、表示名、定義、有効期間、変更責任者を一覧にし、対応表と配布先も管理します。','古いコードを削除すると、過去の取引を読めなくなることがあります。利用停止と過去データからの削除を分け、必要な履歴を残します。同じコードに別の意味を安易に再割り当てしないようにします。')],
 ['共通化は、日々の更新と解除まで含む',prose('一度名寄せしても、新規登録や変更で重複はまた生まれます。登録時の確認、変更の承認、配布、失敗時の再送、定期照合を組み合わせます。誤ってまとめた記録を切り離す手順も必要です。','中央のマスターへ置き換える方法だけでなく、元システムの記録を保ち共通IDでつなぐ方法もあります。業務の制約に合わせて方式を選び、何を共通に管理するかを明確にしましょう。')],
 ],example:{bad:'氏名が同じなら全件統合し、最後に更新された行の住所を採用する。',good:'同一対象の根拠を確認し、曖昧な候補は保留する。住所は確認済みの情報を選び、出所と判断記録を残す。',why:'対象が同じかの判断と、どの属性値を採用するかの判断を分けています。'},
 labs:[classification('データの役割を分類する','この販売業務での主な役割を選びます。',['マスターデータ','参照データ','取引データ'],[['顧客IDと顧客の基本情報',0,'共有する業務対象です。'],['注文状態コードとその意味',1,'状態を表す値の集合です。'],['昨日の注文と数量',2,'発生した出来事です。'],['商品IDと商品名',0,'商品という基本対象です。'],['都道府県コード一覧',1,'住所を分類する値の集合です。']])],
 quiz:[['名寄せで避けるべき判断は？',['氏名が同じだけで同一と断定','根拠を確認','曖昧な候補は保留'],0,'別人を統合するとデータが混ざります。'],['ゴールデンレコードの属性値は？',['常に最新の更新行を使う','項目ごとの基準で選ぶ','元の出所を消す'],1,'確認日や信頼できる情報源などを考慮します。'],['利用停止した参照コードは？',['過去の記録も一律削除','別の意味で即再利用','履歴の読み取りと有効期間を管理'],2,'過去の取引が何を意味したか残す必要があります。']],
 exercise:[{q:'同名の二人を誤って統合した場合、何を戻し、何を確認しますか。',a:'判断記録と元の識別子を基に関連付けを解除する。住所、注文、請求、配布済みデータへの影響を確認し、訂正を利用先へ届ける。'},{q:'注文状態コードを変更する際の管理項目を挙げてください。',a:'旧コードと新コードの意味、適用日、対応表、過去の取引の読み方、変更承認者、配布先、受け手の反映確認。'}],takeaways:['マスターは基本対象、参照データは値の集合、取引は出来事','同一対象の判定と属性値の採用を分ける','共通ID・コード・履歴・配布を継続して管理する'],sources:['dama','dmbokjp']
},
{
 area:'use',title:'データウェアハウスとBI',subtitle:'一行の意味と指標の定義をそろえ、判断につなげる',time:45,
 summary:'データを集めてグラフにする前に、何を比較し、どんな判断をするか。業務データと分析データ、粒度、履歴、指標の定義を学びます。',tags:['DWH','BI','ファクトとディメンション','粒度','指標定義'],goal:'業務処理と分析の用途を区別し、重複集計を避け、指標に対象・期間・更新時点を添えられる。',
 sections:[
 ['何を判断するための数字？',prose('<b>データウェアハウス（DWH）</b>は、分析に使うデータを集め、意味や履歴を整える場所です。<b>BI</b>は、それをレポートや分析として判断に役立てる活動や仕組みです。','「売上を見る」だけでは曖昧です。「地域ごとに販売計画を見直すため、今年と前年の計上売上を比べる」なら、必要な地域、期間、指標が決まります。グラフの形式より先に、判断の問いを置きます。')+flow(['判断の問い','必要なデータ','定義と履歴を整える','比較して見る','行動を決める'])],
 ['業務で使う形と、分析で使う形',table(['用途','主な関心','例'],[['日々の業務処理','現在の一件を正しく処理する','注文受付、出荷状態の更新'],['分析','多くの記録を期間や切り口で比較する','地域別の前年対比、商品の販売傾向']])+prose('業務システムへ重い集計を集中させると、受付処理へ影響する場合があります。分析用に整理したデータを持つことには、業務との負荷の分離や、複数システムの定義をそろえる目的があります。','ただし分析用のデータは、元データからの更新に遅れがあり得ます。いつの状態かを表示し、リアルタイムの出荷判断など、用途が違うものへそのまま流用しないようにします。')],
 ['出来事と、比較の切り口を分ける',tree('販売実績（ファクト）',[['いつ',['日付、月、年度']],['何を',['商品、カテゴリ']],['どこで',['店舗、地域']]])+prose('<b>ファクト</b>は販売などの観測した事実、<b>ディメンション</b>は日付や商品などの比較の切り口です。まず実績の一行が、注文全体なのか、注文明細なのか、店舗別の一日なのかを決めます。','図で中心の実績に切り口をつなぐ形をスタースキーマと呼びます。用語を暗記するよりも、事実をどの単位で持ち、どの切り口で比較するかを説明できることが大切です。')],
 ['粒度が違うデータを、そのまま足さない',prose('一つの注文が三つの明細を持つとき、注文総額を各明細に付けて合計すると、総額を三回数えてしまいます。結合後に行数が増えたら、数字も重複していないか確認します。','「月・店舗単位の目標」と「日・商品単位の実績」も、そのまま比較できません。比較したい単位へ実績を集約するか、目標を分ける根拠を別に決めます。存在しない商品別目標を勝手に作らないようにします。')+note('販売金額は対象が重複しなければ合計できますが、月末在庫を日ごとに足しても月間在庫にはなりません。指標ごとに合計・平均・時点の扱いを決めます。')],
 ['履歴と、指標の説明を保つ',prose('店舗が別の地域へ所属を変えた場合、過去の売上を当時の地域で見たいのか、現在の地域で見たいのかを確認します。最新情報で上書きすると、当時の構成での比較ができなくなることがあります。')+table(['指標の説明','例'],[['名前と用途','販売計画見直し用の計上売上'],['対象と除外','計上済み、返品を差し引く'],['期間と時点','月末締め、翌営業日更新'],['切り口','月・店舗・商品カテゴリ'],['責任者と確認','経理オーナー承認、元帳と照合']])+prose('レポートには数字だけでなく定義と最終更新時点を添えます。見栄えのよいグラフでも、元データと照合できない数字は判断に使いにくいものです。')],
 ],example:{bad:'注文総額を明細へ結合し、全行を合計して売上とする。更新時点も返品の扱いも表示しない。',good:'実績の一行を注文明細と決め、対応する明細金額を集計する。売上の定義・対象期間・更新時点を表示し、元データと照合する。',why:'一行の意味をそろえることで重複を避け、指標の説明で比較できる状態にしています。'},
 labs:[classification('数字を使う前に、何を確認？','最も直接の確認事項を選びます。',['粒度と重複','指標の定義','更新時点','履歴の扱い'],[['明細をつないだら売上が三倍になった',0,'注文総額を明細ごとに繰り返していないか確認します。'],['営業と経理で返品の扱いが違う',1,'売上に何を含めるかを確認します。'],['今日の出荷判断に昨日のデータを使う',2,'用途に必要な新しさを満たすか確認します。'],['店舗の異動で前年の地域売上が変わった',3,'当時の所属と現在の所属を分けます。']])],
 quiz:[['ファクトの一行で先に決めるのは？',['グラフの色','表の横幅','何の単位の事実か'],2,'粒度が曖昧だと重複や比較の誤りが起きます。'],['月・店舗の目標と日・商品の実績は？',['比較の単位をそろえる','すべて直接結合する','目標を各商品へ同額コピー'],0,'比較する粒度を決めて集約や配分の根拠を確認します。'],['月末在庫を毎日足すと？',['必ず月間在庫になる','意味のある月間指標になるとは限らない','常に売上になる'],1,'時点の残高を期間で足すことには注意が必要です。']],
 exercise:[{q:'「月・店舗別の売上目標」と「注文明細の実績」を比較する方法を説明してください。',a:'実績を目標と同じ月・店舗単位に集約して比較する。店舗、期間、売上の定義をそろえ、商品別の目標が必要なら配分根拠を別に決める。'},{q:'地域別の前年対比レポートに付ける説明を挙げてください。',a:'売上の計上条件、返品・取消の扱い、比較期間、地域は当時か現在か、締めと更新時点、責任者、照合先。'}],takeaways:['DWHは分析のために整え、BIは判断につなぐ','一行の意味と比較する単位をそろえる','定義・履歴・更新時点を数字と一緒に提供する'],sources:['dmbokjp','star']
},
{
 area:'use',title:'ドキュメントとコンテンツ管理',subtitle:'最新版・正式版・保存期間を区別し、文書を見つけて使う',time:40,
 summary:'契約書、手順書、画像、メールも管理対象です。表の形でない情報を、作成から承認・利用・保存・廃棄までつなげて管理します。',tags:['版管理','正式版','記録','検索','保存と廃棄'],goal:'最新版と正式版を区別し、文書に必要な属性・権限・保存と廃棄の手順を説明できる。',
 sections:[
 ['表の形ではない情報も、資産になる',prose('契約書、作業手順、画像、メールなどには、業務の約束や判断の根拠が残っています。保存場所が分からない、似た名前のファイルが多い、古い手順を使ってしまう問題も、データマネジメントの対象です。','文書の本文をすべて表に変える必要はありません。文書の識別子、種類、作成者、状態、適用日などの属性を添えて、探し、判断し、正しく利用できるようにします。')],

// 学習サイト共通：学習科学にもとづく学び方の仕組みと、同期・AI への質問。app.js より先に読み込む（関数は app.js から呼ぶ）。
// 根拠：練習テストと分散学習（Dunlosky ら 2013、Donoghue & Hattie 2021）、連続再学習（Rawson & Dunlosky）、
// 交互練習（Brunmair & Richter 2019）、事前の質問（Pan & Carpenter 2023）、確信度と誤りの修正（Butterfield & Metcalfe 2001）。
// 同期と AI は、共通の API（study-api）を通す。合言葉はこのブラウザにだけ保存し、OpenAI の鍵はサーバー側にだけ置く。
const STUDY_API=/^(127\.0\.0\.1|localhost)$/.test(location.hostname)?'http://127.0.0.1:8787':'https://study-api.gakutoyashiro.workers.dev'; // 手元で試すときは、手元の API を使う
const STUDY_SITES=[['学習ノート（ホーム）','https://study-home.gakutoyashiro.workers.dev/'],['Snowflake','https://snowflake-learning.gakutoyashiro.workers.dev/'],['データマネジメント','https://data-management.gakutoyashiro.workers.dev/'],['コンサルティングスキル','https://consulting-skills.gakutoyashiro.workers.dev/'],['プロジェクトマネジメント','https://project-management.gakutoyashiro.workers.dev/']];
const BOX_DAYS=[1,3,7,14,30,60]; // 復習の間隔（日）。正解して自信があれば次の箱へ、間違えたら最初の箱へ

// ---------- 日付 ----------
const ymd=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const todayStr=()=>ymd(Date.now());
const addDays=(n,from=Date.now())=>ymd(new Date(from).getTime()+n*86400000);
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);

// ---------- 状態の補い（古い保存データでも動くように） ----------
function ensureLearnState(){
  state.srs=state.srs||{};state.days=state.days||{};state.targets=state.targets||{};state.recall=state.recall||{};state.recallSeen=state.recallSeen||{};
  state.calib=state.calib||{hi:[0,0],lo:[0,0]};state.doneT=state.doneT||{};state.textT=state.textT||{};
}
const markActivity=()=>{const d=todayStr();state.days[d]=(state.days[d]||0)+1};
const itemKey=(i,k)=>`${LESSONS[i].title}#${k}`;            // 章を足しても変わらない鍵（章の題名＋問題の番号）
function itemFromKey(key){const p=key.lastIndexOf('#');const title=key.slice(0,p),k=Number(key.slice(p+1));const i=LESSONS.findIndex(l=>l.title===title);return i<0||!LESSONS[i].quiz[k]?null:{i,k,q:LESSONS[i].quiz[k]}}
const scopeOf=i=>(typeof useTracks==='function'&&useTracks())?LESSONS[i].exam:'_site';

// ---------- 間隔をあけた復習 ----------
// 章の理解チェックで初めて答えたとき（または章を完了したとき）に復習の対象に入れ、翌日から出題する。
function srsSeen(i,k,ok){ensureLearnState();const key=itemKey(i,k);if(!state.srs[key])state.srs[key]={b:0,due:addDays(1),t:Date.now(),n:1,c:ok?1:0};markActivity();save()}
function srsAddChapter(i){ensureLearnState();LESSONS[i].quiz.forEach((_,k)=>{const key=itemKey(i,k);if(!state.srs[key])state.srs[key]={b:0,due:addDays(1),t:Date.now(),n:0,c:0}});save()}
function intervalCap(i){const tg=state.targets[scopeOf(i)];if(!tg||!tg.date)return Infinity;const left=daysBetween(todayStr(),tg.date);return left<=1?1:Math.max(1,Math.floor(left*0.2))} // 試験までの残りの約2割を上限に
function srsReview(i,k,ok,conf){
  ensureLearnState();const key=itemKey(i,k);const it=state.srs[key]||{b:0,n:0,c:0};
  it.n++;if(ok)it.c++;
  if(ok&&conf==='hi')it.b=Math.min(it.b+1,BOX_DAYS.length-1);else if(!ok){it.b=0;if(conf==='hi')it.hc=(it.hc||0)+1}
  it.due=addDays(Math.min(BOX_DAYS[it.b],intervalCap(i)));it.t=Date.now();state.srs[key]=it;
  const c=state.calib[conf==='hi'?'hi':'lo'];c[1]++;if(ok)c[0]++;
  markActivity();save();
}
function dueItems(scope){ensureLearnState();const t=todayStr();return Object.entries(state.srs).filter(([,v])=>v.due<=t).map(([key])=>itemFromKey(key)).filter(Boolean).filter(x=>!scope||scope==='all'||scopeOf(x.i)===scope)}
function dueCount(scope){return dueItems(scope).length}

// ---------- 今日やること（ホームの上部） ----------
function todayPanel(t){
  ensureLearnState();const scope=t||(typeof useTracks==='function'&&useTracks()?null:'all');const due=dueCount(scope||'all');
  const ls=typeof trackLessons==='function'?trackLessons(t):LESSONS.map((_,i)=>i);const next=ls.find(i=>!state.done.includes(i));
  const tg=state.targets[t||'_site'];const left=tg&&tg.date?daysBetween(todayStr(),tg.date):null;
  return `<div class="today"><div><b>今日やること</b><span>${due?`復習 ${due}問`:'復習はありません'}${next!==undefined?` · 次の章：${chapterLabel(next)} ${LESSONS[next].title}`:' · すべての章を完了'}${left!==null&&left>=0?` · 目標日まで ${left}日`:''}</span></div><div class="today-actions">${due?`<a class="primary" href="#review">復習する（${due}問）</a>`:''}${next!==undefined?`<a class="home-link" href="#chapter-${next+1}">次の章へ</a>`:''}<a class="home-link" href="#progress">進捗を見る</a></div></div>`;
}

// ---------- 今日の復習 ----------
let reviewRun=null;
function reviewScopes(){return (typeof useTracks==='function'&&useTracks())?[...EXAMS.map(e=>[e.id,e.title]),['all','すべてのコース']]:[['all','すべての章']]}
function reviewPage(){
  ensureLearnState();const cur=(typeof currentTrack==='function'&&currentTrack())||'all';
  const scopes=reviewScopes();const total=Object.keys(state.srs).length;
  return `<article class="lesson"><div class="lesson-nav"><a href="#home">ホーム</a> / 今日の復習</div><p class="eyebrow">SPACED RETRIEVAL</p><h1>今日の復習</h1>
<p class="summary">学んだ章の問題を、日をあけて思い出します。章をまぜて出題し、答える前に確信度を選びます。間違えた問題は、この回の最後にもう一度出ます。</p>
${total?'':`<div class="note">まだ復習する問題がありません。章の理解チェックに答えるか、章を完了にすると、翌日から復習に入ります。</div>`}
<div class="lab"><span class="lab-heading">SETTINGS</span><div class="labgrid"><div><label for="rv-scope">範囲</label><select id="rv-scope">${scopes.map(([id,n])=>`<option value="${id}" ${id===cur?'selected':''}>${n}（今日 ${dueCount(id)}問）</option>`).join('')}</select></div><div><label for="rv-count">問題数</label><select id="rv-count"><option value="10">10問</option><option value="20" selected>20問</option><option value="0">期限の来た全問</option></select></div></div>
<div class="lab-actions"><button class="primary" id="rv-start">復習を始める</button><button id="rv-ahead">期限前の問題も練習する</button></div></div>
<div id="rv-area"></div></article>`;
}
function initReview(){
  const start=ahead=>{const scope=$('#rv-scope').value,n=Number($('#rv-count').value);
    let items=ahead?Object.keys(state.srs).map(itemFromKey).filter(Boolean).filter(x=>scope==='all'||scopeOf(x.i)===scope):dueItems(scope);
    items=shuffle(items);if(n)items=items.slice(0,n);
    if(!items.length){$('#rv-area').innerHTML='<p class="empty">この範囲には、今日復習する問題はありません。「期限前の問題も練習する」で前倒しもできます。</p>';return}
    reviewRun={queue:items.map(x=>({...x,tries:0})),done:0,first:0,firstOk:0,hiWrong:[],total:items.length};showCard()};
  $('#rv-start').onclick=()=>start(false);$('#rv-ahead').onclick=()=>start(true);
}
function showCard(){
  const area=$('#rv-area');const it=reviewRun.queue[0];
  if(!it){const r=reviewRun;area.innerHTML=`<div class="lab"><span class="lab-heading">RESULT</span><div class="metrics"><div class="metric">${r.firstOk} / ${r.first}<small>1回目で正解</small></div><div class="metric ${r.hiWrong.length?'warn':''}">${r.hiWrong.length}<small>自信ありで間違えた</small></div></div>${r.hiWrong.length?`<p><b>思い込みに注意：</b>自信があったのに間違えた問題です。早めにもう一度出題します。</p><ul>${r.hiWrong.map(x=>`<li><a href="#chapter-${x.i+1}">${chapterLabel(x.i)} ${LESSONS[x.i].title}</a>：${x.q[0]}</li>`).join('')}</ul>`:''}<p>次の復習の予定は、<a href="#progress">進捗</a>で確認できます。</p></div>`;area.scrollIntoView({behavior:'smooth'});return}
  const n=reviewRun.total-reviewRun.queue.length+1;
  area.innerHTML=`<div class="quiz review-card"><p class="muted" style="font-size:12px;margin:0 0 6px">${reviewRun.done+1}問目（残り ${reviewRun.queue.length}）· ${chapterLabel(it.i)} ${LESSONS[it.i].title}${it.tries?' · もう一度':''}</p>${quizItem(it.q,0,{label:'Q',mode:'exam'})}
<div class="conf-row"><span>答えを選んだら、確信度を選んで回答：</span><button class="primary" data-conf="hi">自信あり</button><button data-conf="lo">自信なし</button></div><div class="rv-after" hidden><div class="lab-actions"><button class="primary" id="rv-next">次へ</button><a href="#chapter-${it.i+1}">章を読み直す</a></div>${aiInline(it.i,`問題：${plain(it.q[0])}\n選択肢：${it.q[1].map((o,j)=>`${letter(j)}. ${plain(o)}`).join(' / ')}\n正解：${(isMulti(it.q[2])?it.q[2]:[it.q[2]]).map(j=>plain(it.q[1][j])).join('、')}\n解説：${plain(it.q[3])}\n\nこの問題の考え方を、別の例を使って説明してください。`)}</div></div>`;
  const item=$('.review-card .qitem');bindQuizItem(item,it.q,'exam');
  $$('[data-conf]',area).forEach(b=>b.onclick=()=>{
    const sel=selectedOf(item);if(!sel.length){$('.feedback',item).textContent='先に答えを選んでください。';return}
    const conf=b.dataset.conf,ok=markQuiz(item,it.q,'show');
    $$('.answer',item).forEach(x=>x.disabled=true);$$('[data-conf]',area).forEach(x=>x.disabled=true);
    if(it.tries===0){reviewRun.first++;if(ok)reviewRun.firstOk++;srsReview(it.i,it.k,ok,conf);if(!ok&&conf==='hi')reviewRun.hiWrong.push(it)}
    $('.feedback',item).innerHTML=`${ok?'○ 正解。':'× 不正解。'}${it.q[3]}${!ok?' この回の最後に、もう一度出ます。':''}`;
    reviewRun.queue.shift();reviewRun.done++;if(!ok&&it.tries<2)reviewRun.queue.push({...it,tries:it.tries+1}); // 正解できるまで、この回の中でもう一度
    $('.rv-after',area).hidden=false;bindAiInline(area);$('#rv-next').onclick=showCard;$('#rv-next').focus();nav();
  });
}

// ---------- 進捗 ----------
function progressPage(){
  ensureLearnState();const tracks=(typeof useTracks==='function'&&useTracks())?EXAMS.map(e=>[e.id,e.title,trackLessons(e.id)]):[['_site',SITE.title,LESSONS.map((_,i)=>i)]];
  const week=Array.from({length:7},(_,d)=>addDays(d));const dueBy=d=>Object.values(state.srs).filter(v=>d===todayStr()?v.due<=d:v.due===d).length;
  const days=Array.from({length:28},(_,d)=>addDays(d-27));const maxAct=Math.max(1,...days.map(d=>state.days[d]||0));
  const c=state.calib,pct=([a,b])=>b?Math.round(a/b*100)+'%':'—';
  return `<article class="lesson"><div class="lesson-nav"><a href="#home">ホーム</a> / 進捗</div><p class="eyebrow">PROGRESS</p><h1>学習の進捗</h1>

// 2台の記録をまとめる：項目ごとに、新しく更新したほうを残す
function mergeState(a,b){
  const out={...a};const later=(ta,tb)=>(tb||0)>(ta||0);
  const chapters=new Set([...Object.keys(a.doneT||{}),...Object.keys(b.doneT||{})]);
  const done=new Set(a.done||[]);(b.done||[]).forEach(i=>{if(!(a.doneT||{})[i]&&!(b.doneT||{})[i])done.add(i)});
  chapters.forEach(i=>{const n=Number(i);const useB=later((a.doneT||{})[i],(b.doneT||{})[i]);const src=useB?b:a;if((src.done||[]).includes(n))done.add(n);else done.delete(n)});
  out.done=[...done];out.doneT={...(a.doneT||{}),...Object.fromEntries(Object.entries(b.doneT||{}).filter(([k,v])=>later((a.doneT||{})[k],v)))};
  out.textT={...(a.textT||{})};['notes','answers','recall'].forEach(f=>{out[f]={...(a[f]||{})}});
  Object.entries(b.textT||{}).forEach(([k,v])=>{if(later((a.textT||{})[k],v)){out.textT[k]=v;const [f,i]=k.split(':');if(b[f]&&b[f][i]!==undefined)out[f][i]=b[f][i]}});
  out.srs={...(a.srs||{})};Object.entries(b.srs||{}).forEach(([k,v])=>{if(!out.srs[k]||later(out.srs[k].t,v.t))out.srs[k]=v});
  out.days={...(a.days||{})};Object.entries(b.days||{}).forEach(([d,n])=>{out.days[d]=Math.max(out.days[d]||0,n)});
  out.targets={...(a.targets||{})};Object.entries(b.targets||{}).forEach(([k,v])=>{if(!out.targets[k]||later(out.targets[k].t,v.t))out.targets[k]=v});
  out.recallSeen={...(a.recallSeen||{}),...(b.recallSeen||{})};
  const seen=new Set();out.exams=[...(a.exams||[]),...(b.exams||[])].filter(e=>{const k=[e.date,e.name,e.correct,e.total].join('|');if(seen.has(k))return false;seen.add(k);return true}).slice(-20);
  out.calib=(b.updatedAt||0)>(a.updatedAt||0)?(b.calib||a.calib):(a.calib||b.calib);
  out.track=(b.updatedAt||0)>(a.updatedAt||0)?(b.track||a.track):(a.track||b.track);
  out.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);
  return out;
}

}

let state={done:[],notes:{},answers:{}};

  try{const s=JSON.parse(localStorage.getItem(SITE.key));if(s&&Array.isArray(s.done)){state={done:s.done,notes:s.notes||{},answers:s.answers||{}};return}}catch(e){}

  try{const o=SITE.legacyKey&&JSON.parse(localStorage.getItem(SITE.legacyKey));if(o&&o.done){

}

function currentTrack(){
  if(!useTracks())return null;
  let m=location.hash.match(/^#track-(\w+)$/);if(m&&trackInfo(m[1]))return m[1];
  m=location.hash.match(/^#chapter-(\d+)$/);if(m&&LESSONS[m[1]-1])return LESSONS[m[1]-1].exam;
  return state.track&&trackInfo(state.track)?state.track:null;
}
// 表示用の章番号（コースがあれば、コースの中での番号）
const chapterNo=i=>useTracks()?trackLessons(LESSONS[i].exam).indexOf(i)+1:i+1;
const chapterLabel=i=>useTracks()?`${trackInfo(LESSONS[i].exam).short} 第${chapterNo(i)}章`:`第${i+1}章`;
const mapHash=t=>t?`#track-${t}`:'#home';

// ---------- サイドバー ----------
function nav(){
  const q=$('#search').value.normalize('NFKC').trim().toLowerCase();
  const active=location.hash||'#home';
  const t=currentTrack();
  let html='';
  if(useTracks())html+=`<div class="track-switch" role="group" aria-label="コースの切り替え">${EXAMS.map(e=>`<a href="#track-${e.id}" class="${e.id===t?'active':''}" ${e.id===t?'aria-current="true"':''}>${e.short}</a>`).join('')}</div>`;
  html+=`<a class="navitem ${active==='#home'?'active':''}" href="#home"><span class="num">⌂</span>${useTracks()?'ホーム（コース一覧）':'学習マップ'}</a>`;
  if(t)html+=`<a class="navitem ${active===`#track-${t}`?'active':''}" href="#track-${t}"><span class="num">▤</span>${trackInfo(t).title}の学習マップ</a>`;
  html+=`<a class="navitem ${active==='#fields'?'active':''}" href="#fields"><span class="num">◇</span>${SITE.fieldsNav}</a>${hasExams()?`<a class="navitem ${active==='#exam'?'active':''}" href="#exam"><span class="num">✎</span>模擬試験</a>`:''}${hasLearn()?(()=>{const n=dueCount(t||'all');return `<a class="navitem ${active==='#review'?'active':''}" href="#review"><span class="num">↻</span>今日の復習${n?` <b class="due-badge">${n}</b>`:''}</a><a class="navitem ${active==='#progress'?'active':''}" href="#progress"><span class="num">▥</span>進捗</a><a class="navitem ${active==='#method'?'active':''}" href="#method"><span class="num">?</span>このサイトの学び方</a><a class="navitem ${active==='#settings'?'active':''}" href="#settings"><span class="num">⚙</span>同期と AI</a>`})():''}`;
  let hits=0;
  if(useTracks()&&!t&&!q)html+='<p class="empty">コースを選ぶと、そのコースの章が表示されます。</p>';
  AREAS.forEach(a=>{
    if(useTracks()&&!q&&(!t||(a.exam&&a.exam!==t)))return;
    const items=LESSONS.map((l,i)=>({l,i})).filter(({l})=>l.area===a.id&&(!q||lessonSearchText(l).includes(q)));
    if(!items.length)return;
    hits+=items.length;
    if(!q)html+=`<div class="nav-phase">${a.name}</div>`;
    html+=items.map(({l,i})=>{const cur=active===`#chapter-${i+1}`;return `<a class="navitem ${cur?'active':''} ${state.done.includes(i)?'done':''}" href="#chapter-${i+1}" ${cur?'aria-current="page"':''}><span class="num">${state.done.includes(i)?'✓':pad(chapterNo(i))}</span>${q&&useTracks()?`<small class="nav-track">${trackInfo(l.exam).short}</small> `:''}${l.title}</a>`}).join('');
  });
  if(q&&!hits)html+='<p class="empty">該当する章がありません。</p>';
  $('#nav').innerHTML=html;
  const scope=trackLessons(t),done=scope.filter(i=>state.done.includes(i)).length;
  $('#count').textContent=`${done} / ${scope.length}`;
  $('#progress').max=scope.length;$('#progress').value=done;
}

// compare：良い例と悪い例のどちらが良いかを選ぶ（全章に自動で付く）
// classify：項目ごとに分類を選び、答え合わせ
// slider：値を動かすと、状態が言葉と図で変わる（式は見せない）
// builder：型に沿って書き、文章にまとめてコピー
function labsOf(l,i){return [{type:'compare',ex:l.example,flip:i%2===1},...(l.labs||[])]}
function labMarkup(lab,print){
  switch(lab.type){
  case 'compare':{const [a,b]=lab.flip?[lab.ex.good,lab.ex.bad]:[lab.ex.bad,lab.ex.good];
    return `<h3>どちらが良い？</h3><p>同じ場面の2つのやり方です。良いと思う方を選んでください。</p><div class="choice-cards"><div data-card="0"><b>A</b>${a}</div><div data-card="1"><b>B</b>${b}</div></div><div class="lab-actions"><button data-pick="0">Aが良い</button><button data-pick="1">Bが良い</button></div><div class="labresult" aria-live="polite">${print?`<p><b>答え：${lab.flip?'A':'B'}</b></p><p>${lab.ex.why}</p>`:'<p>選ぶと、何を変えたかの説明が出ます。</p>'}</div>`}
  case 'classify':
    return `<h3>${lab.title}</h3><p>${lab.intro}</p><ol class="sortlist">${lab.items.map(([t,ans,why],j)=>`<li data-i="${j}"><span class="mark">${t}</span><select aria-label="${esc(plain(t))}の分類"><option value="">選ぶ…</option>${lab.options.map((o,k)=>`<option value="${k}">${o}</option>`).join('')}</select><p class="why" ${print?'':'hidden'}>答え：${lab.options[ans]}。${why}</p></li>`).join('')}</ol><div class="lab-actions"><button data-check>答え合わせ</button><button data-reset>やり直す</button></div><div class="labresult" aria-live="polite"><p>すべて選んでから答え合わせをしてください。</p></div>`;
  case 'slider':
    return `<h3>${lab.title}</h3><p>${lab.intro}</p><div class="labgrid">${lab.inputs.map(x=>`<div><label>${x.label}：<output data-out="${x.id}">${x.value}${x.unit||''}</output></label><input type="range" data-in="${x.id}" min="${x.min}" max="${x.max}" step="${x.step||1}" value="${x.value}"></div>`).join('')}</div><div class="labresult" aria-live="polite"></div>`;
  case 'builder':
    return `<h3>${lab.title}</h3><p>${lab.intro}</p>${lab.fields.map(f=>`<label>${f.label}</label>${f.multiline?`<textarea data-in="${f.id}" rows="2" maxlength="500">${esc(f.value)}</textarea>`:`<input data-in="${f.id}" maxlength="200" value="${esc(f.value)}">`}`).join('')}<div class="labresult builder-out" aria-live="polite"></div><div class="lab-actions"><button data-copy>文章をコピー</button><span class="copy-status" role="status"></span></div>`;
  case 'checklist':
    return `<h3>${lab.title}</h3><p>${lab.intro}</p><div class="checks">${lab.items.map((t,j)=>`<label><input type="checkbox" data-in="${j}">${t}</label>`).join('')}</div><div class="labresult" aria-live="polite"></div>`;
  }
}
function initLab(lab,el,interactive=true){
  const result=$('.labresult',el);
  const values=()=>Object.fromEntries($$('[data-in]',el).map(x=>[x.dataset.in,x.type==='checkbox'?x.checked:x.type==='range'?Number(x.value):x.value]));
  const update=()=>{
    if(lab.type==='slider'){const v=values();lab.inputs.forEach(x=>{$(`[data-out="${x.id}"]`,el).value=v[x.id]+(x.unit||'')});result.innerHTML=lab.render(v)}
    if(lab.type==='builder')result.textContent=lab.render(values());
    if(lab.type==='checklist'){const v=values();const n=Object.values(v).filter(Boolean).length;result.innerHTML=lab.render(n,lab.items.length,v)}
  };
  update();
  if(!interactive)return;
  $$('[data-in]',el).forEach(x=>x.addEventListener('input',update));
  if(lab.type==='compare')$$('[data-pick]',el).forEach(b=>b.onclick=()=>{
    const pick=Number(b.dataset.pick),good=lab.flip?0:1,ok=pick===good;
    $$('[data-card]',el).forEach(c=>c.classList.remove('picked-ok','picked-ng'));
    $(`[data-card="${pick}"]`,el).classList.add(ok?'picked-ok':'picked-ng');
    result.innerHTML=`<p><b>${ok?'その通りです。':`良いのは${good?'B':'A'}です。`}</b></p><p>${lab.ex.why}</p>`;
  });
  if(lab.type==='classify'){
    $('[data-check]',el).onclick=()=>{let ok=0,blank=0;
      $$('.sortlist li',el).forEach(li=>{const [, ans]=lab.items[li.dataset.i];const v=$('select',li).value;li.classList.remove('ok','ng');if(v===''){blank++;return}const hit=Number(v)===ans;if(hit)ok++;li.classList.add(hit?'ok':'ng');$('.why',li).hidden=false});
      result.innerHTML=`<p><b>${ok} / ${lab.items.length} 問 正解</b>${blank?`（未選択 ${blank}）`:''}</p><p>${ok===lab.items.length?'すべて正解です。':'説明を読んで、間違えた項目の考え方を確かめましょう。'}</p>`};
    $('[data-reset]',el).onclick=()=>{$$('.sortlist li',el).forEach(li=>{li.classList.remove('ok','ng');$('select',li).value='';$('.why',li).hidden=true});result.innerHTML='<p>すべて選んでから答え合わせをしてください。</p>'};
  }
  if(lab.type==='builder')$('[data-copy]',el).onclick=()=>copyText(result.textContent,$('.copy-status',el));
}
async function copyText(text,target){try{await navigator.clipboard.writeText(text);target.textContent='コピーしました'}catch(e){target.textContent='コピーできません。表示された文章を選択してコピーしてください。'}}

// ---------- 理解チェック ----------
// quiz の1問は [問い, 選択肢, 正解, 解説]。正解が配列なら「複数選ぶ」問題になる。
const isMulti=a=>Array.isArray(a);
const sameSet=(x,y)=>x.length===y.length&&x.every(v=>y.includes(v));
const letter=j=>String.fromCharCode(65+j);
// SITE.shuffleOptions が true なら、選択肢の並びを入れ替えて表示する（正解の位置が偏らないように）。
// 章の理解チェックでは問いごとに決まった並び、模擬試験では毎回ランダム。data-answer は元の番号のまま。
function seededOrder(n,text){let h=2166136261;for(const ch of text)h=Math.imul(h^ch.charCodeAt(0),16777619);
  const rnd=()=>{h=Math.imul(h^(h>>>15),2246822507);h=Math.imul(h^(h>>>13),3266489909);return((h^=h>>>16)>>>0)/4294967296};
  const o=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[o[i],o[j]]=[o[j],o[i]]}return o}
function optionOrder(opts,q,mode){if(!SITE.shuffleOptions)return [...opts.keys()];return mode==='exam'?shuffle([...opts.keys()]):seededOrder(opts.length,q)}
function quizItem([q,opts,a,why],k,{print=false,label=`Q${k+1}`,mode='practice'}={}){
  const multi=isMulti(a);
  return `<div class="qitem" data-q="${k}"><p>${label}. ${q}${multi?` <span class="multi-tag">${a.length}つ選ぶ</span>`:''}</p>${optionOrder(opts,q,mode).map((j,pos)=>`<button class="answer" data-answer="${j}" aria-pressed="false">${letter(pos)}. ${opts[j]}</button>`).join('')}${multi&&!print&&mode==='practice'?'<button class="check-multi">回答する</button>':''}<div class="feedback" role="status" aria-live="polite"></div><div class="print-only">正解：${(multi?a:[a]).map(x=>opts[x]).join('／')}。${why}</div></div>`;
}
const selectedOf=item=>$$('.answer.selected',item).map(b=>Number(b.dataset.answer));
function markQuiz(item,[, ,a,why],extra=''){
  const correct=isMulti(a)?a:[a],sel=selectedOf(item),ok=sameSet(sel,correct);
  $$('.answer',item).forEach(b=>{const j=Number(b.dataset.answer);b.classList.toggle('correct',correct.includes(j)&&(ok||sel.includes(j)||extra!==''));b.classList.toggle('wrong',sel.includes(j)&&!correct.includes(j))});
  return ok;
}
function bindQuizItem(item,q,mode='practice',onAnswer=null){
  const multi=isMulti(q[2]);
  $$('.answer',item).forEach(btn=>btn.onclick=()=>{
    if(!multi)$$('.answer',item).forEach(b=>{b.classList.remove('selected');b.setAttribute('aria-pressed','false')});
    btn.classList.toggle('selected',multi?undefined:true);btn.setAttribute('aria-pressed',btn.classList.contains('selected'));
    if(mode==='practice'&&!multi){const ok=markQuiz(item,q);$('.feedback',item).textContent=ok?'正解です。'+q[3]:'もう一度考えてみましょう。';if(onAnswer)onAnswer(ok)}
  });
  const check=$('.check-multi',item);
  if(check)check.onclick=()=>{const sel=selectedOf(item);if(!sel.length){$('.feedback',item).textContent=`${q[2].length}つ選んでから回答してください。`;return}
    const ok=markQuiz(item,q);$('.feedback',item).textContent=ok?'正解です。'+q[3]:`もう一度考えてみましょう（正解は${q[2].length}つです）。`;if(onAnswer)onAnswer(ok)};
}

// ---------- 模擬試験（content.js に EXAMS があるサイトだけ） ----------
const hasExams=()=>typeof EXAMS!=='undefined';
const examOf=l=>hasExams()&&l.exam?EXAMS.find(e=>e.id===l.exam):null;
let examRun=null;
function examPool(id){return LESSONS.flatMap((l,i)=>(id==='all'||l.exam===id)?l.quiz.map((q,k)=>({q,i,exam:l.exam,domain:l.domain})):[])}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function examPage(){
  const hist=(state.exams||[]).slice(-5).reverse();
  return `<article class="lesson exam-page"><div class="lesson-nav"><a href="${mapHash(currentTrack())}">学習マップ</a> / 模擬試験</div><p class="eyebrow">PRACTICE EXAM</p><h1>模擬試験</h1><p class="summary">${SITE.examIntro||''}</p>
<div class="lab"><span class="lab-heading">SETTINGS</span><h3>出題の範囲と問題数</h3><div class="labgrid"><div><label for="exam-scope">範囲</label><select id="exam-scope">${EXAMS.map(e=>`<option value="${e.id}" ${e.id===state.track?'selected':''}>${e.name}（${examPool(e.id).length}問から）</option>`).join('')}<option value="all">すべての章（${examPool('all').length}問から）</option></select></div><div><label for="exam-count">問題数</label><select id="exam-count"><option value="10">10問</option><option value="20" selected>20問</option><option value="0">全問</option></select></div></div><div class="lab-actions"><button class="primary" id="exam-start">開始する</button></div></div>
${hist.length?`<div class="takeaways"><h3>これまでの結果（このブラウザに保存）</h3><ul>${hist.map(h=>`<li>${h.date} · ${h.name} · ${h.correct} / ${h.total}問（${Math.round(h.correct/h.total*100)}%）</li>`).join('')}</ul></div>`:''}
<div id="exam-area"></div></article>`;
}
function initExam(){
  $('#exam-start').onclick=()=>{const id=$('#exam-scope').value,n=Number($('#exam-count').value);const pool=shuffle(examPool(id));
    examRun={id,name:$('#exam-scope').selectedOptions[0].textContent.replace(/（.*$/,''),items:n?pool.slice(0,n):pool};
    $('#exam-area').innerHTML=`<div class="quiz"><h3>${examRun.items.length}問 · すべて選んでから、最後に採点します</h3>${examRun.items.map((it,k)=>quizItem(it.q,k,{label:`問${k+1}`,mode:'exam'})).join('')}<div class="lab-actions"><button class="primary" id="exam-grade">採点する</button><span class="feedback" id="exam-warn"></span></div></div><div id="exam-result"></div>`;
    $$('#exam-area .qitem').forEach((item,k)=>bindQuizItem(item,examRun.items[k].q,'exam'));
    $('#exam-grade').onclick=gradeExam;$('#exam-area').scrollIntoView({behavior:'smooth'})};
}
function gradeExam(){
  const items=$$('#exam-area .qitem');const blank=items.filter(it=>!selectedOf(it).length).length;
  if(blank&&!$('#exam-grade').dataset.confirm){$('#exam-grade').dataset.confirm='1';$('#exam-warn').textContent=`未回答が${blank}問あります。このまま採点するなら、もう一度押してください。`;return}
  let correct=0;const by={};
  items.forEach((item,k)=>{const it=examRun.items[k],ok=markQuiz(item,it.q,'show');if(ok)correct++;
    const key=it.exam+'|'+it.domain;by[key]=by[key]||[0,0];by[key][1]++;if(ok)by[key][0]++;
    $$('.answer',item).forEach(b=>b.disabled=true);
    $('.feedback',item).innerHTML=`${ok?'○ 正解。':'× 不正解。'}${it.q[3]} <a href="#chapter-${it.i+1}">${chapterLabel(it.i)}で復習 →</a>`});
  $('#exam-grade').remove();$('#exam-warn').textContent='';
  const total=items.length,pct=Math.round(correct/total*100);
  const rows=EXAMS.flatMap(e=>e.domains.map(([d,name,w])=>{const r=by[e.id+'|'+d];return r?[`${e.short} ${d} ${name}`,`${w}%`,`${r[0]} / ${r[1]}`,`${Math.round(r[0]/r[1]*100)}%`]:null}).filter(Boolean));
  $('#exam-result').innerHTML=`<div class="lab"><span class="lab-heading">RESULT</span><div class="metrics"><div class="metric ${pct<75?'warn':''}">${correct} / ${total}<small>正解数</small></div><div class="metric ${pct<75?'warn':''}">${pct}%<small>正答率</small></div></div><p>${pct>=85?'よくできています。間違えた問題の章だけ見直しましょう。':pct>=75?'あと一歩です。正答率の低い領域から復習しましょう。':'正答率の低い領域の章を読み直してから、もう一度挑戦しましょう。'}</p>${table(['領域','配点','正解','正答率'],rows)}<p class="muted" style="font-size:12px">${SITE.examNote||''}</p></div>`;
  state.exams=[...(state.exams||[]),{date:new Date().toLocaleDateString('ja-JP'),name:examRun.name,correct,total}].slice(-20);save();
  $('#exam-result').scrollIntoView({behavior:'smooth'});
}

// ---------- 章 ----------
function lesson(i,print=false){
  const l=LESSONS[i],n=LESSONS.length,area=AREAS.find(a=>a.id===l.area);
  const ans=state.answers[i]||{},ex=examOf(l);
  const t=useTracks()?l.exam:null,list=trackLessons(t),pos=list.indexOf(i),prev=list[pos-1],next=list[pos+1],map=mapHash(t);
  return `<article class="lesson" data-chapter="${i}"><div class="lesson-nav"><a href="${map}">${t?trackInfo(t).title:'学習マップ'}</a> / ${area.name} / 第${chapterNo(i)}章</div>
<p class="eyebrow">${t?trackInfo(t).short.toUpperCase()+' · ':''}CHAPTER ${pad(chapterNo(i))} / ${pad(list.length)} · 学習時間の目安 ${l.time}分</p><h1>${l.title}</h1><p class="summary">${l.summary}</p><div class="tags">${ex?`<span class="tag-exam">${ex.short} · 領域 ${l.domain} ${ex.domains.find(d=>d[0]===l.domain)[1]}</span>`:''}${l.tags.map(t=>`<span>${t}</span>`).join('')}</div>
<div class="objectives"><b>この章のゴール</b><p>${l.goal}</p></div>
${!print&&hasLearn()?`<section class="pretest"><h3>読む前に、予想してみる</h3><p>答えを知らなくて大丈夫です。先に予想してから読むと、本文の中で答えを探しながら読めるので、記憶に残りやすくなります。</p>${l.quiz.slice(0,2).map((q,k)=>quizItem(q,k,{label:`予想${k+1}`})).join('')}</section>`:''}
${l.sections.map(([t,b],j)=>`<section><h2><span class="secnum">${pad(j+1)}</span>${t}</h2>${b}</section>`).join('')}
${labsOf(l,i).map((lab,k)=>`<div class="lab" data-lab="${k}"><span class="lab-heading">TRY IT YOURSELF${labsOf(l,i).length>1?` · ${k+1}`:''}</span>${labMarkup(lab,print)}</div>`).join('')}
<div class="quiz"><h3>理解チェック</h3>${l.quiz.map((q,k)=>quizItem(q,k,{print})).join('')}</div>
<section class="exercise"><h3>自分の手で考える</h3>${l.exercise.map((e,k)=>`<div class="ex"><p>${k+1}. ${e.q}</p>${print?'':`<textarea data-answer-box="${k}" aria-label="演習${k+1}の自分の答え" placeholder="自分の答えを書いてみましょう（このブラウザに保存されます）">${esc(ans[k]||'')}</textarea>`}<details ${print?'open':''}><summary>解答の例を見る</summary><p>${e.a}</p></details></div>`).join('')}</section>
${print||!hasLearn()?`<div class="takeaways"><h3>この章のまとめ</h3><ul>${l.takeaways.map(t=>`<li>${t}</li>`).join('')}</ul></div>`:`<div class="takeaways recall"><h3>何も見ずに、思い出してみる</h3><p>この章の要点を、本文を見ずに書き出してみましょう（3つが目安）。思い出す練習そのものが、記憶を強くします。</p><textarea data-recall rows="4" placeholder="例：〇〇は△△のための仕組み。□□のときに使う…">${esc((state.recall||{})[i]||'')}</textarea><div class="lab-actions"><button data-reveal-take>書けたら、まとめと比べる</button></div><ul data-take ${(state.recallSeen||{})[i]?'':'hidden'}>${l.takeaways.map(t=>`<li>${t}</li>`).join('')}</ul></div>`}
${print?'':`<div class="memo"><label for="memo">学習メモ</label><textarea id="memo" placeholder="今日理解したこと、まだ疑問なこと、自分の言葉での説明…">${esc(state.notes[i]||'')}</textarea><small id="memo-status" aria-live="polite">このブラウザに保存します（同期を設定すると、ほかの端末にも反映）。</small></div>
${hasLearn()?aiInline(i):''}
<div class="lesson-bottom"><a href="${prev!==undefined?`#chapter-${prev+1}`:map}">← ${prev!==undefined?'前の章':'学習マップ'}</a><button class="primary" id="complete">${state.done.includes(i)?'✓ 完了済み（取り消す）':'この章を完了にする'}</button><a href="${next!==undefined?`#chapter-${next+1}`:map}">${next!==undefined?'次の章':t?'コースの学習マップ':'学習マップ'} →</a></div>`}
<div class="sources"><b>参考資料</b>${sourceLinks(l.sources)}</div></article>`;
}
function bindLesson(i){
  const l=LESSONS[i];
  labsOf(l,i).forEach((lab,k)=>initLab(lab,$(`.lab[data-lab="${k}"]`)));
  $$('.pretest .qitem').forEach(item=>bindQuizItem(item,l.quiz[item.dataset.q]));
  $$('.quiz .qitem').forEach(item=>{const k=Number(item.dataset.q);bindQuizItem(item,l.quiz[k],'practice',ok=>{if(hasLearn())srsSeen(i,k,ok)})});
  if(hasLearn()){const ta=$('[data-recall]');if(ta){ta.oninput=()=>{state.recall[i]=ta.value;state.textT['recall:'+i]=Date.now();save()};$('[data-reveal-take]').onclick=()=>{$('[data-take]').hidden=false;state.recallSeen[i]=1;markActivity();save()}}bindAiInline($('#main'))}
  $$('[data-answer-box]').forEach(t=>t.oninput=()=>{state.answers[i]=state.answers[i]||{};state.answers[i][t.dataset.answerBox]=t.value;state.textT=state.textT||{};state.textT['answers:'+i]=Date.now();save()});
  $('#memo').oninput=()=>{state.notes[i]=$('#memo').value;state.textT=state.textT||{};state.textT['notes:'+i]=Date.now();$('#memo-status').textContent=save()?'メモをこのブラウザに保存しました。':'保存できません。メモをコピーして手元に残してください。'};
  $('#complete').onclick=()=>{state.done=state.done.includes(i)?state.done.filter(v=>v!==i):[...state.done,i];state.doneT=state.doneT||{};state.doneT[i]=Date.now();if(hasLearn()&&state.done.includes(i)){srsAddChapter(i);markActivity()}const ok=save();nav();
    $('#complete').textContent=state.done.includes(i)?'✓ 完了済み（取り消す）':'この章を完了にする';
    if(!ok)$('#memo-status').textContent='ブラウザ保存が使えないため、再読込すると進捗が消えます。'};
}

// ---------- 印刷（全章） ----------
function cleanPrintDocument(){$('#print-document')?.remove();document.body.classList.remove('print-all')}
function preparePrintDocument(){
  cleanPrintDocument();
  const out=document.createElement('div');out.id='print-document';
  out.innerHTML=`<p class="print-intro">${SITE.name} · ${SITE.title}。実験は初期設定の状態、演習とクイズは答えを表示しています。</p>`+home()+fieldsPage()+LESSONS.map((_,i)=>lesson(i,true)).join('');
  $$('.lesson',out).forEach((root,i)=>labsOf(LESSONS[i],i).forEach((lab,k)=>initLab(lab,$(`.lab[data-lab="${k}"]`,root),false)));
  $$('details',out).forEach(d=>d.open=true);
  $$('.quiz .answer',out).forEach(b=>{const d=document.createElement('div');d.className='print-choice';d.textContent=b.textContent;b.replaceWith(d)});
  $$('.lab input:not([type=checkbox]),.lab select,.lab textarea',out).forEach(x=>{const d=document.createElement('div');d.className='print-value';d.textContent=x.tagName==='SELECT'?'':x.value;x.replaceWith(d)});
  $$('button,.map-tools',out).forEach(x=>x.remove());
  $$('[id]',out).forEach(x=>x.removeAttribute('id'));$$('[for]',out).forEach(x=>x.removeAttribute('for'));
  document.body.appendChild(out);document.body.classList.add('print-all');
}

// ---------- 画面の切り替え ----------
function render(focus=false){
  const legacy=location.hash.match(/^#l(\d+)$/);
  if(legacy){history.replaceState(null,'',`#chapter-${legacy[1]}`)}
  nav();
  const m=location.hash.match(/^#chapter-(\d+)$/);const i=m?Number(m[1])-1:-1;
  const tr=currentTrack();if(tr&&state.track!==tr){state.track=tr;save()}
  const tm=location.hash.match(/^#track-(\w+)$/);
  const lp={'#review':['今日の復習',()=>reviewPage(),()=>initReview()],'#progress':['進捗',()=>progressPage(),()=>initProgress()],'#method':['このサイトの学び方',()=>methodPage(),()=>{}],'#settings':['同期と AI の設定',()=>settingsPage(),()=>initSettings()]}[location.hash];
  if(lp&&hasLearn()){$('#main').innerHTML=lp[1]();document.title=`${lp[0]}｜${SITE.name}`;lp[2]()}
  else if(tm&&useTracks()&&trackInfo(tm[1])){$('#main').innerHTML=trackHome(tm[1]);document.title=`${trackInfo(tm[1]).title}｜${SITE.name}`}
  else if(location.hash==='#exam'&&hasExams()){$('#main').innerHTML=examPage();document.title=`模擬試験｜${SITE.name}`;initExam()}
  else if(location.hash==='#fields'){$('#main').innerHTML=fieldsPage();document.title=`${SITE.fieldsNav}｜${SITE.name}`;initFields()}
  else if(i<0||i>=LESSONS.length){$('#main').innerHTML=home();document.title=`${SITE.title}｜${SITE.name}`}
  else{$('#main').innerHTML=lesson(i);document.title=`${chapterLabel(i)} ${LESSONS[i].title}｜${SITE.name}`;bindLesson(i)}
  if(focus){window.scrollTo({top:0,behavior:'instant'});$('#main').focus({preventScroll:true})}
}
if(typeof consumeConnectHash==='function')consumeConnectHash();
loadState();if(hasLearn())ensureLearnState();
$('#search').oninput=nav;
$('.skip').onclick=e=>{e.preventDefault();$('#main').focus()};
window.addEventListener('hashchange',()=>render(true));
$('#print').onclick=()=>{preparePrintDocument();window.print()};
window.addEventListener('afterprint',cleanPrintDocument);
render();
if(hasLearn()){syncNow().then(()=>{if(syncInfo.state==='ok')render()});window.addEventListener('focus',()=>{if(getSettings().token)syncNow()})}
</script></body></html>
